<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comic Book Scanner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- HTML5 QRCode Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom scrollbar for collection list */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }

        /* Video element styling overrides for html5-qrcode */
        #reader video {
            object-fit: cover;
            border-radius: 0.75rem;
        }
        #reader {
            border: none !important;
            border-radius: 0.75rem;
            overflow: hidden;
            background: #000;
        }
        #reader__dashboard_section_csr span {
            color: #fff !important;
        }
        #reader__dashboard_section_csr button {
            background-color: #3b82f6 !important;
            color: white !important;
            border: none !important;
            padding: 0.5rem 1rem !important;
            border-radius: 0.5rem !important;
            margin-top: 0.5rem !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Notification = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose, message]);

            const bgColor = type === 'error' ? 'bg-rose-500' : type === 'success' ? 'bg-emerald-500' : 'bg-blue-500';
            
            return (
                <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-lg text-white text-sm font-bold shadow-lg shadow-black/50 ${bgColor}`}>
                    {message}
                </div>
            );
        };

        const Scanner = ({ onScan }) => {
            useEffect(() => {
                const scanner = new Html5QrcodeScanner("reader", { 
                    qrbox: { width: 250, height: 150 }, 
                    fps: 10 
                });
                
                scanner.render((text) => {
                    scanner.clear();
                    onScan(text);
                }, (error) => {
                    // Ignore background scanning errors
                });

                return () => { 
                    try {
                        scanner.clear();
                    } catch (e) {
                        console.error("Scanner cleanup error:", e);
                    }
                };
            }, [onScan]);

            return <div id="reader" className="w-full bg-black rounded-xl overflow-hidden aspect-[4/3] flex items-center justify-center border border-slate-700"></div>;
        };

        const CoverScanner = ({ onScanResult }) => {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [stream, setStream] = useState(null);
            const [errorMsg, setErrorMsg] = useState('');

            useEffect(() => {
                startCamera();
                return () => stopCamera();
            }, []);

            const startCamera = async () => {
                try {
                    const mediaStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment' } 
                    });
                    if (videoRef.current) {
                        videoRef.current.srcObject = mediaStream;
                    }
                    setStream(mediaStream);
                    setErrorMsg('');
                } catch (err) {
                    setErrorMsg('Camera access denied. Check browser permissions.');
                }
            };

            const stopCamera = () => {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            };

            const captureAndAnalyze = async () => {
                const geminiKey = localStorage.getItem('geminiApiKey');
                if (!geminiKey) {
                    setErrorMsg('Gemini API key is required in Settings for AI Scanning.');
                    return;
                }

                setIsAnalyzing(true);
                const video = videoRef.current;
                const canvas = canvasRef.current;
                const context = canvas.getContext('2d');
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Get base64 string
                const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "Analyze this comic book cover. Return ONLY a JSON object with the following keys: title (string), issue (string, include #), publisher (string), year (number), rarity (string, e.g. 'Standard', 'Variant Cover', 'Key Issue'), price (number, estimated raw value). Do not include any markdown formatting, just the raw JSON." },
                                    { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                                ]
                            }]
                        })
                    });
                    
                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);
                    
                    let resultText = data.candidates[0].content.parts[0].text;
                    resultText = resultText.replace(/```json/g, '').replace(/```/g, '').trim(); // Clean JSON
                    
                    const parsed = JSON.parse(resultText);
                    
                    const comicData = {
                        id: `AI-${Date.now().toString().slice(-6)}`,
                        title: parsed.title || 'Unknown Title',
                        issue: parsed.issue || '#1',
                        publisher: parsed.publisher || 'Unknown Publisher',
                        year: parsed.year || new Date().getFullYear(),
                        rarity: parsed.rarity || 'Standard',
                        price: parseFloat(parsed.price || 0),
                        scannedAt: new Date().toISOString(),
                        isMock: false
                    };
                    
                    onScanResult(comicData);
                } catch (err) {
                    console.error(err);
                    setErrorMsg('Failed to analyze image. Ensure your key is valid and image is clear.');
                } finally {
                    setIsAnalyzing(false);
                }
            };

            return (
                <div className="flex flex-col space-y-4 animate-fade-in">
                    {errorMsg && (
                        <div className="text-rose-400 text-xs text-center p-2 bg-rose-500/20 border border-rose-500/50 rounded-lg">
                            {errorMsg}
                        </div>
                    )}
                    <div className="relative rounded-xl overflow-hidden bg-black aspect-[3/4] border border-slate-700 shadow-inner">
                        <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover" />
                        <canvas ref={canvasRef} className="hidden" />
                        
                        {/* Camera Guides */}
                        <div className="absolute inset-0 border-2 border-indigo-500/30 m-6 rounded-lg pointer-events-none border-dashed"></div>
                        
                        {isAnalyzing && (
                            <div className="absolute inset-0 bg-slate-900/80 flex flex-col items-center justify-center z-10 backdrop-blur-sm">
                                <i data-lucide="sparkles" className="w-10 h-10 text-indigo-400 animate-pulse mb-3"></i>
                                <span className="text-white font-semibold text-sm animate-pulse tracking-wide uppercase">AI Analyzing Cover...</span>
                            </div>
                        )}
                    </div>
                    <button 
                        onClick={captureAndAnalyze}
                        disabled={isAnalyzing}
                        className="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-900/50 flex justify-center items-center space-x-2 transition-all active:scale-95 disabled:opacity-50"
                    >
                        <i data-lucide="camera" className="w-5 h-5"></i>
                        <span>Scan Cover with AI</span>
                    </button>
                </div>
            );
        };

        // --- Mock Data Generator for Comic Books ---
        // In a real app, you would use an API like Comic Vine or Metron.
        const generateMockComic = (barcode) => {
            const publishers = ["Marvel Comics", "DC Comics", "Image Comics", "Dark Horse", "IDW Publishing"];
            const titles = ["Amazing Spider-Man", "Batman", "Spawn", "X-Men", "Superman", "Saga", "The Walking Dead", "Daredevil", "Flash", "Invincible"];
            const rarities = ["Standard", "Standard", "Standard", "Variant Cover", "Key Issue", "Retailer Incentive (1:25)"];
            
            // Seed randomness based on barcode string so the same barcode always gives the same comic
            let seed = 0;
            for (let i = 0; i < barcode.length; i++) {
                seed += barcode.charCodeAt(i);
            }
            
            const publisher = publishers[seed % publishers.length];
            const title = titles[(seed * 3) % titles.length];
            const issueNo = (seed % 150) + 1;
            const year = 2024 - (seed % 40);
            const rarity = rarities[(seed * 7) % rarities.length];
            
            let price = (Math.random() * 20 + 3).toFixed(2);
            if (rarity === "Key Issue") price = (Math.random() * 300 + 50).toFixed(2);
            if (rarity.includes("Variant")) price = (Math.random() * 50 + 10).toFixed(2);

            return {
                id: barcode,
                title: title,
                issue: `#${issueNo}`,
                publisher: publisher,
                year: year,
                rarity: rarity,
                price: parseFloat(price),
                scannedAt: new Date().toISOString()
            };
        };

        const App = () => {
            const [collection, setCollection] = useState([]);
            const [currentComic, setCurrentComic] = useState(null);
            const [sheetUrl, setSheetUrl] = useState(localStorage.getItem('googleSheetUrl') || '');
            const [geminiKey, setGeminiKey] = useState(localStorage.getItem('geminiApiKey') || '');
            const [showSettings, setShowSettings] = useState(false);
            const [notification, setNotification] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const [inputMode, setInputMode] = useState('cover'); // 'cover', 'barcode', or 'manual'

            // Manual Entry State
            const [manualForm, setManualForm] = useState({
                title: '', issue: '', publisher: '', year: '', rarity: 'Standard', price: ''
            });

            // Re-initialize Lucide icons when renders change
            useEffect(() => {
                lucide.createIcons();
            });

            // Handle successful barcode scan
            const handleScan = (barcode) => {
                setNotification({ message: "Barcode detected! Generating Mock Data...", type: "info" });
                
                // Simulate network delay for API lookup
                setTimeout(() => {
                    const comicData = generateMockComic(barcode);
                    comicData.isMock = true; // Flag to show user this is fake data
                    setCurrentComic(comicData);
                    setNotification(null);
                }, 800);
            };

            const handleCoverScanResult = (comicData) => {
                setCurrentComic(comicData);
                setNotification({ message: "AI Analysis Complete!", type: "success" });
            };

            const handleManualSubmit = (e) => {
                e.preventDefault();
                if (!manualForm.title) return setNotification({ message: "Title is required", type: "error" });
                
                const newComic = {
                    id: `MANUAL-${Date.now().toString().slice(-6)}`,
                    title: manualForm.title,
                    issue: manualForm.issue ? `#${manualForm.issue}` : 'N/A',
                    publisher: manualForm.publisher || 'Unknown',
                    year: manualForm.year || new Date().getFullYear(),
                    rarity: manualForm.rarity,
                    price: parseFloat(manualForm.price || 0),
                    scannedAt: new Date().toISOString(),
                    isMock: false
                };
                
                setCurrentComic(newComic);
                setManualForm({ title: '', issue: '', publisher: '', year: '', rarity: 'Standard', price: '' });
                setNotification({ message: "Manual entry ready to save!", type: "success" });
            };

            // --- STREAMING_CHUNK:Google Sheets Export Logic ---
            const saveToSheet = async () => {
                if (!currentComic) return;
                
                // Add to local collection state immediately
                setCollection(prev => [currentComic, ...prev]);

                if (!sheetUrl) {
                    setNotification({ message: "Saved locally. Add Webhook URL to save to Sheets.", type: "info" });
                    setCurrentComic(null);
                    return;
                }

                setIsSaving(true);
                
                try {
                    // Send data to Google Apps Script Webhook
                    const response = await fetch(sheetUrl, {
                        method: 'POST',
                        mode: 'no-cors', // Required for simple Google Apps Script webhooks without complex CORS setup
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            barcode: currentComic.id,
                            title: currentComic.title,
                            issue: currentComic.issue,
                            publisher: currentComic.publisher,
                            year: currentComic.year,
                            rarity: currentComic.rarity,
                            price: currentComic.price
                        })
                    });

                    // Because of 'no-cors', response is opaque. We assume success if no exception is thrown.
                    setNotification({ message: "Saved to Google Sheet!", type: "success" });
                } catch (error) {
                    console.error("Error saving to sheet:", error);
                    setNotification({ message: "Error saving to Sheet. Check URL.", type: "error" });
                } finally {
                    setIsSaving(false);
                    setCurrentComic(null); // Clear current to ready for next scan
                }
            };

            const saveSettings = () => {
                localStorage.setItem('googleSheetUrl', sheetUrl);
                localStorage.setItem('geminiApiKey', geminiKey);
                setShowSettings(false);
                setNotification({ message: "Settings saved", type: "success" });
            };

            const clearCollection = () => {
                if(confirm("Are you sure you want to clear your local session history?")) {
                    setCollection([]);
                }
            };

            return (
                <div className="min-h-screen flex flex-col max-w-md mx-auto bg-slate-900 border-x border-slate-800 shadow-2xl relative">
                    
                    {notification && (
                        <Notification 
                            message={notification.message} 
                            type={notification.type} 
                            onClose={() => setNotification(null)} 
                        />
                    )}

                    {/* Header */}
                    <header className="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center sticky top-0 z-10">
                        <div className="flex items-center space-x-2">
                            <i data-lucide="book-open" className="text-indigo-400 w-6 h-6"></i>
                            <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">
                                Comic Scanner AI
                            </h1>
                        </div>
                        <button 
                            onClick={() => setShowSettings(!showSettings)}
                            className={`p-2 transition-colors ${showSettings ? 'text-indigo-400' : 'text-slate-400 hover:text-white'}`}
                        >
                            <i data-lucide="settings" className="w-6 h-6"></i>
                        </button>
                    </header>

                    {/* Settings Panel */}
                    {showSettings && (
                        <div className="p-4 bg-slate-800 border-b border-slate-700 animate-fade-in space-y-4">
                            <div>
                                <h2 className="text-sm font-semibold text-slate-300 mb-1 uppercase tracking-wide flex items-center gap-1">
                                    <i data-lucide="table" className="w-4 h-4"></i> Google Sheets Setup
                                </h2>
                                <p className="text-xs text-slate-400 mb-2">
                                    Paste your Google Apps Script Web App URL below to send comics directly to a spreadsheet.
                                </p>
                                <input 
                                    type="url" 
                                    value={sheetUrl}
                                    onChange={(e) => setSheetUrl(e.target.value)}
                                    placeholder="https://script.google.com/macros/s/..."
                                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                />
                            </div>
                            
                            <div>
                                <h2 className="text-sm font-semibold text-slate-300 mb-1 uppercase tracking-wide flex items-center gap-1">
                                    <i data-lucide="key" className="w-4 h-4"></i> Gemini AI Key <span className="text-[10px] bg-indigo-500/20 text-indigo-300 px-1 rounded">Required for Mobile</span>
                                </h2>
                                <p className="text-xs text-slate-400 mb-2">
                                    Get a free key from <a href="https://aistudio.google.com/" target="_blank" rel="noreferrer" className="text-indigo-400 underline">Google AI Studio</a> to enable cover scanning on your phone.
                                </p>
                                <input 
                                    type="password" 
                                    value={geminiKey}
                                    onChange={(e) => setGeminiKey(e.target.value)}
                                    placeholder="AIzaSy..."
                                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                />
                            </div>

                            <div className="flex space-x-2 pt-2">
                                <button 
                                    onClick={saveSettings}
                                    className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-sm font-medium"
                                >
                                    Save Config
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Mode Toggle */}
                    <div className="flex bg-slate-800 border-b border-slate-700">
                        <button 
                            onClick={() => { setInputMode('cover'); setCurrentComic(null); }}
                            className={`flex-1 py-3 text-sm font-medium flex flex-col justify-center items-center space-y-1 transition-colors ${inputMode === 'cover' ? 'border-b-2 border-indigo-500 text-indigo-400' : 'text-slate-400 hover:text-slate-300'}`}
                        >
                            <i data-lucide="image" className="w-5 h-5"></i>
                            <span className="text-xs">AI Cover Scan</span>
                        </button>
                        <button 
                            onClick={() => { setInputMode('barcode'); setCurrentComic(null); }}
                            className={`flex-1 py-3 text-sm font-medium flex flex-col justify-center items-center space-y-1 transition-colors ${inputMode === 'barcode' ? 'border-b-2 border-blue-500 text-blue-400' : 'text-slate-400 hover:text-slate-300'}`}
                        >
                            <i data-lucide="scan-line" className="w-5 h-5"></i>
                            <span className="text-xs">Barcode</span>
                        </button>
                        <button 
                            onClick={() => { setInputMode('manual'); setCurrentComic(null); }}
                            className={`flex-1 py-3 text-sm font-medium flex flex-col justify-center items-center space-y-1 transition-colors ${inputMode === 'manual' ? 'border-b-2 border-emerald-500 text-emerald-400' : 'text-slate-400 hover:text-slate-300'}`}
                        >
                            <i data-lucide="keyboard" className="w-5 h-5"></i>
                            <span className="text-xs">Manual</span>
                        </button>
                    </div>

                    {/* Main Content Area */}
                    <main className="flex-1 p-4 flex flex-col space-y-6 overflow-y-auto">
                        
                        {/* Input Section */}
                        <section>
                            {inputMode === 'cover' ? (
                                <CoverScanner onScanResult={handleCoverScanResult} />
                            ) : inputMode === 'barcode' ? (
                                <Scanner onScan={handleScan} />
                            ) : (
                                <form onSubmit={handleManualSubmit} className="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 animate-fade-in">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Comic Title *</label>
                                        <input type="text" required placeholder="e.g. Amazing Spider-Man" 
                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:ring-1 focus:ring-blue-500 outline-none"
                                            value={manualForm.title} onChange={e => setManualForm({...manualForm, title: e.target.value})}
                                        />
                                    </div>
                                    <div className="flex space-x-3">
                                        <div className="flex-1">
                                            <label className="block text-xs text-slate-400 mb-1">Issue #</label>
                                            <input type="text" placeholder="300" 
                                                className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:ring-1 focus:ring-blue-500 outline-none"
                                                value={manualForm.issue} onChange={e => setManualForm({...manualForm, issue: e.target.value})}
                                            />
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-xs text-slate-400 mb-1">Year</label>
                                            <input type="number" placeholder="1988" 
                                                className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:ring-1 focus:ring-blue-500 outline-none"
                                                value={manualForm.year} onChange={e => setManualForm({...manualForm, year: e.target.value})}
                                            />
                                        </div>
                                    </div>
                                    <div className="flex space-x-3">
                                        <div className="flex-[2]">
                                            <label className="block text-xs text-slate-400 mb-1">Publisher</label>
                                            <input type="text" placeholder="Marvel" 
                                                className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:ring-1 focus:ring-blue-500 outline-none"
                                                value={manualForm.publisher} onChange={e => setManualForm({...manualForm, publisher: e.target.value})}
                                            />
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-xs text-slate-400 mb-1">Est. Value ($)</label>
                                            <input type="number" step="0.01" placeholder="0.00" 
                                                className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:ring-1 focus:ring-blue-500 outline-none"
                                                value={manualForm.price} onChange={e => setManualForm({...manualForm, price: e.target.value})}
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Key / Variant Status</label>
                                        <select 
                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white focus:ring-1 focus:ring-blue-500 outline-none"
                                            value={manualForm.rarity} onChange={e => setManualForm({...manualForm, rarity: e.target.value})}
                                        >
                                            <option value="Standard">Standard / Regular Cover</option>
                                            <option value="Variant Cover">Variant Cover</option>
                                            <option value="Key Issue">Key Issue (1st App, Death, etc.)</option>
                                            <option value="Signed">Signed Edition</option>
                                        </select>
                                    </div>
                                    <button type="submit" className="w-full mt-2 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition-colors">
                                        Generate Entry
                                    </button>
                                </form>
                            )}
                        </section>

                        {}
                        {currentComic && (
                            <section className="bg-slate-800 rounded-xl p-5 border border-indigo-500/30 shadow-lg shadow-indigo-900/20 animate-fade-in relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-24 h-24 bg-indigo-500/10 rounded-bl-full -z-0"></div>
                                
                                <div className="flex justify-between items-start relative z-10 mb-4">
                                    <div>
                                        <p className="text-xs font-semibold text-slate-400 uppercase tracking-widest">{currentComic.publisher}</p>
                                        <h2 className="text-2xl font-bold text-white leading-tight mt-1">{currentComic.title}</h2>
                                        <p className="text-lg font-medium text-indigo-400">{currentComic.issue} <span className="text-slate-500 text-sm">({currentComic.year})</span></p>
                                        {currentComic.isMock && (
                                            <span className="inline-block mt-2 bg-rose-500/20 text-rose-400 border border-rose-500/50 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">
                                                Mock Barcode Data (Fake Result)
                                            </span>
                                        )}
                                        {!currentComic.isMock && inputMode === 'cover' && (
                                            <span className="inline-flex mt-2 items-center gap-1 bg-indigo-500/20 text-indigo-300 border border-indigo-500/50 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">
                                                <i data-lucide="sparkles" className="w-3 h-3 text-amber-300"></i> AI Estimated Data
                                            </span>
                                        )}
                                    </div>
                                    <div className="bg-slate-900 px-3 py-1 rounded-lg border border-slate-700 text-right">
                                        <p className="text-xs text-slate-400">Est. Value</p>
                                        <p className="text-xl font-bold text-emerald-400">${currentComic.price.toFixed(2)}</p>
                                    </div>
                                </div>

                                <div className="flex items-center space-x-2 mb-6">
                                    <span className={`px-2 py-1 text-xs font-bold rounded-md ${
                                        currentComic.rarity === 'Key Issue' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/50' : 
                                        currentComic.rarity.includes('Variant') ? 'bg-purple-500/20 text-purple-400 border border-purple-500/50' : 
                                        'bg-slate-700 text-slate-300'
                                    }`}>
                                        {currentComic.rarity}
                                    </span>
                                    <span className="text-xs text-slate-500 font-mono">ID: {currentComic.id}</span>
                                </div>

                                <div className="flex space-x-3 relative z-10">
                                    <button 
                                        onClick={() => setCurrentComic(null)}
                                        className="flex-1 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-medium transition-colors"
                                    >
                                        Discard
                                    </button>
                                    <button 
                                        onClick={saveToSheet}
                                        disabled={isSaving}
                                        className="flex-[2] py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold flex justify-center items-center space-x-2 transition-colors disabled:opacity-50"
                                    >
                                        <i data-lucide={isSaving ? "loader-2" : "database"} className={`w-5 h-5 ${isSaving ? 'animate-spin' : ''}`}></i>
                                        <span>{isSaving ? 'Saving...' : 'Save to Collection'}</span>
                                    </button>
                                </div>
                            </section>
                        )}

                        {}
                        <section className="flex-1">
                            <div className="flex justify-between items-center mb-3">
                                <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wide">Session History</h3>
                                {collection.length > 0 && (
                                    <button onClick={clearCollection} className="text-xs text-red-400 hover:text-red-300">Clear</button>
                                )}
                            </div>
                            
                            {collection.length === 0 ? (
                                <div className="text-center py-10 text-slate-600">
                                    <i data-lucide="inbox" className="w-12 h-12 mx-auto mb-2 opacity-20"></i>
                                    <p className="text-sm">No comics scanned in this session.</p>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {collection.map((comic, idx) => (
                                        <div key={idx} className="bg-slate-800 p-3 rounded-lg border border-slate-700 flex justify-between items-center">
                                            <div>
                                                <p className="text-white font-medium text-sm leading-none mb-1">
                                                    {comic.title} <span className="text-blue-400">{comic.issue}</span>
                                                </p>
                                                <div className="flex items-center space-x-2 text-xs">
                                                    <span className="text-slate-400">{comic.publisher}</span>
                                                    <span className="text-slate-600">•</span>
                                                    <span className={comic.rarity === 'Key Issue' ? 'text-amber-400' : 'text-slate-500'}>
                                                        {comic.rarity}
                                                    </span>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-emerald-400 font-bold text-sm">${comic.price.toFixed(2)}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </section>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
