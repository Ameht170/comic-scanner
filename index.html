<!DOCTYPE htmldddddd>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comic Scanner AI</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Barcode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Hugging Face Transformers.js (Zero-Cost Client-Side AI) -->
    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.16.1';
        env.allowLocalModels = false;
        window.hfPipeline = pipeline;
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .tab-active { border-bottom: 2px solid #a855f7; color: #a855f7; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const getActiveKey = (keyString) => {
            if (!keyString) return null;
            const keys = keyString.split(',').map(k => k.trim()).filter(k => k);
            if (keys.length === 0) return null;
            return keys[Math.floor(Math.random() * keys.length)];
        };

        const Icons = {
            Camera: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
            Barcode: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4m16-6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V6z"></path></svg>,
            Manual: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 20h9M3 20h9M3 14h18M3 8h18M5 8v12M19 8v12"></path></svg>,
            Settings: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
            Save: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>,
            Spinner: () => <svg className="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>,
            Book: () => <svg className="w-7 h-7 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        };

        const AICoverScanner = ({ apiKeyString, onResult, onError }) => {
            const [scanning, setScanning] = React.useState(false);
            const [statusText, setStatusText] = React.useState('Scan Cover with AI');
            const [imageSrc, setImageSrc] = React.useState(null);
            const videoRef = React.useRef(null);
            const streamRef = React.useRef(null);
            const classifierRef = React.useRef(null);

            const startCamera = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                    }
                    streamRef.current = stream;
                } catch (err) {
                    onError("Could not access camera. Please check permissions.");
                }
            };

            React.useEffect(() => {
                startCamera();
                return () => {
                    if (streamRef.current) {
                        streamRef.current.getTracks().forEach(track => track.stop());
                    }
                };
            }, []);

            const captureAndScan = async () => {
                const activeKey = getActiveKey(apiKeyString);
                if (!activeKey) {
                    onError("Please add your Gemini API Key in Settings first.");
                    return;
                }
                if (!videoRef.current) return;

                setScanning(true);
                
                // Aggressive compression to prevent token limits
                const canvas = document.createElement('canvas');
                const scale = 600 / videoRef.current.videoWidth;
                canvas.width = 600;
                canvas.height = videoRef.current.videoHeight * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                const base64Image = dataUrl.split(',')[1];
                setImageSrc(dataUrl);

                try {
                    // --- STEP 1: Hugging Face Client-Side Pre-Check ---
                    if (window.hfPipeline) {
                        setStatusText('Verifying cover locally (HF)...');
                        if (!classifierRef.current) {
                            classifierRef.current = await window.hfPipeline('image-classification', 'Xenova/vit-base-patch16-224');
                        }
                        const predictions = await classifierRef.current(dataUrl);
                        
                        // Check if predictions resemble printed matter / books / comics
                        const looksLikeCover = predictions.some(p => 
                            p.label.toLowerCase().includes('comic') || 
                            p.label.toLowerCase().includes('book') || 
                            p.label.toLowerCase().includes('jacket') || 
                            p.label.toLowerCase().includes('poster') ||
                            p.label.toLowerCase().includes('paper')
                        );

                        // If confidence is totally misplaced (e.g. scanning a laptop keyboard or coffee mug)
                        if (!looksLikeCover && predictions[0].score > 0.6) {
                            throw new Error(`Local check failed: Detected "${predictions[0].label}". Please aim directly at a comic cover.`);
                        }
                    }

                    // --- STEP 2: Gemini Deep Inspection & Appraisal ---
                    setStatusText('Analyzing Cover text & market value...');
                    let resultData = null;
                    const maxRetries = 2;
                    
                    const promptText = `Act as an expert comic book appraiser. Analyze this cover.
INSTRUCTIONS:
1. Extract title, issue number, publisher, and year.
2. If the cover indicates 'Variant', use your visual knowledge of comic art to identify the specific cover artist (e.g., Peach Momoko, Skottie Young) and append it to rarity.
3. PRICE TRAP: Find the original printed face value (e.g. $1.95, $3.99) and place it strictly in the "original_cover_price" key. 
4. CURRENT MARKET VALUE: You MUST estimate the actual, current secondary market collector value in US Dollars for a raw copy today, and place this in the "price" key. DO NOT put the face value here.

Return ONLY valid JSON with keys: title, issue, publisher, year, rarity, original_cover_price, price.`;

                    for (let i = 0; i <= maxRetries; i++) {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${activeKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: promptText },
                                        { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                                    ]
                                }],
                                generationConfig: { responseMimeType: "application/json" }
                            })
                        });
                        
                        const data = await response.json();
                        
                        if (response.status === 429 || (data.error && data.error.message.toLowerCase().includes('quota'))) {
                            if (i < maxRetries) {
                                setStatusText(`Rate limit! Retrying in 10s...`);
                                await new Promise(r => setTimeout(r, 10000));
                                setStatusText("Retrying scan now...");
                                continue;
                            } else {
                                throw new Error("API Limit Maxed out. Please add multiple keys in Settings or wait 1 minute.");
                            }
                        }
                        
                        if (data.error) throw new Error(data.error.message);
                        resultData = data;
                        break; 
                    }
                    
                    let resultText = resultData.candidates[0].content.parts[0].text;
                    resultText = resultText.replace(/```json/gi, '').replace(/```/g, '').trim(); 
                    
                    const resultJson = JSON.parse(resultText);
                    onResult(resultJson);
                } catch (err) {
                    console.error(err);
                    onError(err.message || "Failed to analyze image. Ensure your key is valid and the text is clear.");
                    setImageSrc(null); 
                } finally {
                    setScanning(false);
                    setStatusText('Scan Cover with AI');
                }
            };

            return (
                <div className="relative rounded-xl overflow-hidden bg-black shadow-lg">
                    {!imageSrc ? (
                        <video ref={videoRef} autoPlay playsInline className="w-full h-[60vh] object-cover"></video>
                    ) : (
                        <img src={imageSrc} className="w-full h-[60vh] object-cover opacity-50" alt="Captured" />
                    )}
                    
                    {!imageSrc && (
                        <div className="absolute inset-0 border-2 border-dashed border-purple-500/50 m-8 rounded-lg pointer-events-none"></div>
                    )}

                    <div className="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/90 to-transparent">
                        <button 
                            onClick={captureAndScan} 
                            disabled={scanning}
                            className={`w-full py-4 text-white rounded-xl font-bold flex items-center justify-center gap-2 transition-colors ${scanning && statusText.includes('Rate limit') ? 'bg-amber-600' : 'bg-purple-600 hover:bg-purple-700 disabled:bg-purple-800'}`}
                        >
                            {scanning ? <Icons.Spinner /> : <Icons.Camera />}
                            {statusText}
                        </button>
                    </div>
                </div>
            );
        };

        const SafeBarcodeScanner = ({ apiKeyString, onResult, onError }) => {
            const [scanning, setScanning] = React.useState(false);
            const [statusText, setStatusText] = React.useState('Start Barcode Scanner');
            const scannerRef = React.useRef(null);

            const lookupBarcodeViaAI = async (barcode) => {
                const activeKey = getActiveKey(apiKeyString);
                if (!activeKey) {
                    onError("Please add your Gemini API Key in Settings to enable Live Barcode Lookups.");
                    setScanning(false);
                    return;
                }
                
                setStatusText("Looking up Barcode & market value...");
                try {
                    let resultData = null;
                    const maxRetries = 1;
                    
                    const promptText = `Act as an expert comic book database and appraiser. I scanned a comic UPC barcode: ${barcode}. Identify the exact comic title, issue number, publisher, year, and rarity/variant.

PRICE TRAP INSTRUCTION:
1. Identify the original printed cover price and place it in the "original_cover_price" key.
2. Estimate TODAY'S CURRENT SECONDARY MARKET COLLECTOR VALUE for a raw copy in US Dollars, and place this strictly in the "price" key. DO NOT put the face value here.

Return ONLY valid JSON with keys: title, issue, publisher, year, rarity, original_cover_price, price.`;

                    for (let i = 0; i <= maxRetries; i++) {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${activeKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: promptText }
                                    ]
                                }],
                                generationConfig: { responseMimeType: "application/json" }
                            })
                        });
                        
                        const data = await response.json();
                        
                        if (response.status === 429 || (data.error && data.error.message.toLowerCase().includes('quota'))) {
                            if (i < maxRetries) {
                                setStatusText("Rate limit! Retrying in 5s...");
                                await new Promise(r => setTimeout(r, 5000));
                                continue;
                            } else {
                                throw new Error("API Limit Maxed out. Please add multiple keys in Settings or wait 1 minute.");
                            }
                        }
                        if (data.error) throw new Error(data.error.message);
                        resultData = data;
                        break;
                    }

                    let resultText = resultData.candidates[0].content.parts[0].text;
                    resultText = resultText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const resultJson = JSON.parse(resultText);
                    
                    setScanning(false);
                    setStatusText("Start Barcode Scanner");
                    onResult(resultJson);
                    
                } catch (err) {
                    console.error(err);
                    onError(err.message || "Failed to lookup barcode in database. Try again.");
                    setScanning(false);
                    setStatusText("Start Barcode Scanner");
                } 
            };

            const startScanning = () => {
                setScanning(true);
                setStatusText("Awaiting Barcode...");
                setTimeout(() => {
                    const scanner = new Html5Qrcode("reader");
                    scannerRef.current = scanner;
                    scanner.start(
                        { facingMode: "environment" },
                        { fps: 10, qrbox: { width: 250, height: 150 } },
                        (decodedText) => {
                            scanner.stop().then(() => {
                                lookupBarcodeViaAI(decodedText);
                            }).catch(err => {
                                console.error("Camera stop error (ignored):", err);
                                lookupBarcodeViaAI(decodedText);
                            });
                        },
                        (err) => { /* ignore continuous stream errors */ }
                    ).catch(err => {
                        onError("Camera blocked or unavailable.");
                        setScanning(false);
                        setStatusText("Start Barcode Scanner");
                    });
                }, 150);
            };

            const stopScanning = () => {
                if (scannerRef.current) {
                    scannerRef.current.stop().then(() => {
                        setScanning(false);
                        setStatusText("Start Barcode Scanner");
                    }).catch(console.error);
                } else {
                    setScanning(false);
                    setStatusText("Start Barcode Scanner");
                }
            };

            React.useEffect(() => {
                return () => {
                    if (scannerRef.current) {
                        try { scannerRef.current.stop().catch(() => {}); } catch(e) {}
                    }
                };
            }, []);

            return (
                <div className="flex flex-col items-center">
                    {!scanning ? (
                        <div className="text-center w-full mt-10">
                            <p className="text-slate-400 mb-6 px-4 text-sm">Scan the UPC barcode to perform a live database lookup using Gemini AI. Works with full 17-digit and partial codes.</p>
                            <button onClick={startScanning} className="w-full py-4 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-bold flex items-center justify-center gap-2 transition-colors">
                                <Icons.Barcode />
                                {statusText}
                            </button>
                        </div>
                    ) : (
                        <div className="w-full flex flex-col items-center mt-4">
                            <div id="reader" className="w-full max-w-md rounded-xl overflow-hidden shadow-2xl bg-black"></div>
                            <p className="mt-4 font-bold text-amber-500 animate-pulse">{statusText}</p>
                            <button onClick={stopScanning} className="mt-6 w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold">
                                Cancel Scanning
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = React.useState('ai');
            const [currentComic, setCurrentComic] = React.useState(null);
            const [history, setHistory] = React.useState([]);
            const [apiKey, setApiKey] = React.useState(localStorage.getItem('geminiApiKey') || '');
            const [scriptUrl, setScriptUrl] = React.useState(localStorage.getItem('sheetScriptUrl') || '');
            const [isSaving, setIsSaving] = React.useState(false);
            const [showSettings, setShowSettings] = React.useState(false);
            const [error, setError] = React.useState('');

            const handleKeyUpdate = (e) => {
                const val = e.target.value;
                setApiKey(val);
                localStorage.setItem('geminiApiKey', val);
            };

            const handleUrlUpdate = (e) => {
                const val = e.target.value;
                setScriptUrl(val);
                localStorage.setItem('sheetScriptUrl', val);
            };

            const triggerError = (msg) => {
                setError(msg);
                setTimeout(() => setError(''), 6000);
            };

            const saveToSheet = async () => {
                if (!scriptUrl) {
                    triggerError("No Google Sheet URL found in Settings! Saved to local history only.");
                    setHistory([currentComic, ...history]);
                    setCurrentComic(null);
                    return;
                }

                setIsSaving(true);
                try {
                    const payload = {
                        barcode: "AI_SCAN",
                        title: currentComic.title,
                        issue: currentComic.issue,
                        publisher: currentComic.publisher,
                        year: currentComic.year,
                        rarity: currentComic.rarity,
                        price: currentComic.price
                    };

                    await fetch(scriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                    
                    setHistory([currentComic, ...history]);
                    setCurrentComic(null);
                } catch (err) {
                    console.error(err);
                    triggerError("Failed to save to Google Sheet. Check URL.");
                } finally {
                    setIsSaving(false);
                }
            };

            return (
                <div className="min-h-screen max-w-md mx-auto flex flex-col relative pb-20">
                    <div className="flex justify-between items-center p-4 border-b border-slate-800 bg-slate-900 sticky top-0 z-10">
                        <div className="flex items-center gap-2">
                            <Icons.Book />
                            <h1 className="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
                                Comic Scanner AI
                            </h1>
                        </div>
                        <button onClick={() => setShowSettings(!showSettings)} className="p-2 text-slate-400 hover:text-white rounded-full transition-colors">
                            <Icons.Settings />
                        </button>
                    </div>

                    {showSettings && (
                        <div className="p-4 bg-slate-800 border-b border-slate-700 animate-fade-in">
                            <h2 className="font-bold mb-4 text-purple-400">Configuration</h2>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs text-amber-400 mb-1 font-bold">Gemini API Key(s)</label>
                                    <p className="text-[10px] text-slate-400 mb-2 leading-tight">Pro-tip: Paste multiple free keys separated by commas to bypass rate limits.</p>
                                    <input 
                                        type="password" 
                                        value={apiKey}
                                        onChange={handleKeyUpdate}
                                        className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:border-purple-500 outline-none"
                                        placeholder="AIzaSy..."
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">Google App Script URL (For Sheets)</label>
                                    <input 
                                        type="text" 
                                        value={scriptUrl}
                                        onChange={handleUrlUpdate}
                                        className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:border-purple-500 outline-none"
                                        placeholder="https://script.google.com/macros/..."
                                    />
                                </div>
                                <button 
                                    onClick={() => setShowSettings(false)}
                                    className="w-full bg-purple-600 py-2 rounded-lg text-sm font-bold text-white hover:bg-purple-700 transition-colors"
                                >
                                    Close Settings (Auto-Saved)
                                </button>
                            </div>
                        </div>
                    )}

                    {error && (
                        <div className="m-4 p-3 bg-red-900/50 border border-red-500/50 rounded-lg text-red-200 text-sm text-center animate-pulse">
                            {error}
                        </div>
                    )}

                    {!currentComic && (
                        <div className="flex px-4 pt-2 mb-4 bg-slate-900">
                            <button onClick={() => setActiveTab('ai')} className={`flex-1 pb-3 text-sm font-medium flex flex-col items-center gap-1 ${activeTab === 'ai' ? 'tab-active' : 'text-slate-500'}`}>
                                <Icons.Camera /> AI Cover
                            </button>
                            <button onClick={() => setActiveTab('barcode')} className={`flex-1 pb-3 text-sm font-medium flex flex-col items-center gap-1 ${activeTab === 'barcode' ? 'tab-active' : 'text-slate-500'}`}>
                                <Icons.Barcode /> Barcode
                            </button>
                            <button onClick={() => setActiveTab('manual')} className={`flex-1 pb-3 text-sm font-medium flex flex-col items-center gap-1 ${activeTab === 'manual' ? 'tab-active' : 'text-slate-500'}`}>
                                <Icons.Manual /> Manual
                            </button>
                        </div>
                    )}

                    <div className="px-4 flex-grow">
                        {!currentComic ? (
                            <>
                                {activeTab === 'ai' && <AICoverScanner apiKeyString={apiKey} onResult={setCurrentComic} onError={triggerError} />}
                                {activeTab === 'barcode' && <SafeBarcodeScanner apiKeyString={apiKey} onResult={setCurrentComic} onError={triggerError} />}
                                {activeTab === 'manual' && (
                                    <div className="mt-8">
                                        <p className="text-slate-400 mb-4 text-center">Manually enter comic details</p>
                                        <button onClick={() => setCurrentComic({title: "Manual Entry", issue: "1", publisher: "Unknown", year: "2026", rarity: "Raw", original_cover_price: "$0.00", price: "$0.00"})} className="w-full bg-slate-700 py-4 rounded-xl text-white font-bold hover:bg-slate-600 transition-colors">
                                            Open Manual Form
                                        </button>
                                    </div>
                                )}
                            </>
                        ) : (
                            <div className="bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700 mt-4 animate-fade-in">
                                <div className="flex justify-between items-start mb-6">
                                    <div>
                                        <h2 className="text-2xl font-black text-white">{currentComic.title}</h2>
                                        <p className="text-purple-400 font-bold mt-1">Issue #{currentComic.issue}</p>
                                    </div>
                                    <div className="bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-full font-bold whitespace-nowrap ml-4">
                                        {currentComic.price}
                                    </div>
                                </div>

                                <div className="space-y-3 text-sm">
                                    <div className="flex justify-between border-b border-slate-700 pb-2">
                                        <span className="text-slate-400">Publisher</span>
                                        <span className="font-medium text-white">{currentComic.publisher}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-slate-700 pb-2">
                                        <span className="text-slate-400">Year</span>
                                        <span className="font-medium text-white">{currentComic.year}</span>
                                    </div>
                                    {currentComic.original_cover_price && (
                                        <div className="flex justify-between border-b border-slate-700 pb-2">
                                            <span className="text-slate-400">Orig. Cover Price</span>
                                            <span className="font-medium text-slate-300">{currentComic.original_cover_price}</span>
                                        </div>
                                    )}
                                    <div className="flex justify-between pt-2">
                                        <span className="text-slate-400 w-1/3">Notes</span>
                                        <span className="font-medium text-white text-right">{currentComic.rarity}</span>
                                    </div>
                                </div>

                                <div className="flex gap-4 mt-8">
                                    <button 
                                        onClick={() => setCurrentComic(null)} 
                                        className="w-1/3 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold transition-colors"
                                    >
                                        Discard
                                    </button>
                                    <button 
                                        onClick={saveToSheet} 
                                        disabled={isSaving}
                                        className="w-2/3 py-3 bg-emerald-600 disabled:bg-emerald-800 hover:bg-emerald-500 text-white rounded-xl font-bold flex items-center justify-center gap-2 transition-colors shadow-lg shadow-emerald-900/50"
                                    >
                                        <span key={isSaving ? 'spin' : 'save'} className="flex items-center gap-2">
                                            {isSaving ? <Icons.Spinner /> : <Icons.Save />} 
                                            {isSaving ? 'Saving...' : 'Save Comic'}
                                        </span>
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    {!currentComic && history.length > 0 && (
                        <div className="px-4 mt-8">
                            <h3 className="text-xs font-bold text-slate-500 mb-3 uppercase tracking-wider">Session History</h3>
                            <div className="space-y-3">
                                {history.map((comic, idx) => (
                                    <div key={idx} className="bg-slate-800/50 border border-slate-700 p-3 rounded-lg flex justify-between items-center">
                                        <div>
                                            <p className="font-bold text-sm text-white">{comic.title} #{comic.issue}</p>
                                            <p className="text-xs text-slate-400">{comic.publisher}</p>
                                        </div>
                                        <p className="text-emerald-400 font-bold text-sm">{comic.price}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
