<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comic Scanner AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .scanner-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(139, 92, 246, 0.2) 0%, transparent 10%, transparent 90%, rgba(139, 92, 246, 0.2) 100%);
            pointer-events: none;
        }
        .scan-line {
            width: 100%; height: 2px; background: #a78bfa;
            position: absolute; top: 0;
            box-shadow: 0 0 10px #a78bfa;
            animation: scan 2s linear infinite;
        }
        @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }
        /* Fix for HTML5-QRCode injecting weird styles */
        #reader { border: none !important; background: transparent !important; }
        #reader video { border-radius: 0.5rem; object-fit: cover; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // SVG Icons to avoid Lucide-React DOM node conflicts during state changes
        const Icons = {
            Camera: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>,
            Barcode: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 5v14"/><path d="M8 5v14"/><path d="M12 5v14"/><path d="M17 5v14"/><path d="M21 5v14"/></svg>,
            Keyboard: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 8h.01"/><path d="M14 8h.01"/><path d="M18 8h.01"/><path d="M6 8h.01"/><path d="M10 12h.01"/><path d="M14 12h.01"/><path d="M18 12h.01"/><path d="M6 12h.01"/><path d="M10 16h4"/><rect x="2" y="4" width="20" height="16" rx="2" ry="2"/></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            Book: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>,
            Save: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
            Loader: () => <svg className="animate-spin" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        };

        const { useState, useEffect, useRef } = React;

        const AICoverScanner = ({ onResult, apiKey }) => {
            const videoRef = useRef(null);
            const [isScanning, setIsScanning] = useState(false);
            const [error, setError] = useState(null);

            useEffect(() => {
                let stream = null;
                const startCamera = async () => {
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({ 
                            video: { facingMode: 'environment' } 
                        });
                        if (videoRef.current) {
                            videoRef.current.srcObject = stream;
                        }
                    } catch (err) {
                        setError("Camera access denied or unavailable.");
                    }
                };
                startCamera();
                return () => {
                    if (stream) stream.getTracks().forEach(track => track.stop());
                };
            }, []);

            const captureAndAnalyze = async () => {
                if (!apiKey) {
                    setError("Gemini API key is required in Settings for AI Scanning.");
                    return;
                }
                
                setIsScanning(true);
                setError(null);
                
                try {
                    const video = videoRef.current;
                    const canvas = document.createElement('canvas');
                    
                    // COMPRESSION FIX: Scale down to max 800px width to prevent large payload crash
                    const MAX_WIDTH = 800;
                    const scale = Math.min(1, MAX_WIDTH / video.videoWidth);
                    canvas.width = video.videoWidth * scale;
                    canvas.height = video.videoHeight * scale;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

                    // STRICT PROMPT UPGRADE FOR HIGH ACCURACY (Anti-Hallucination)
                    const strictPrompt = "Analyze this comic book cover. You MUST read the literal text of the main title logo on the cover word-for-word (e.g., look closely to differentiate 'Ultimate Endgame' from 'Ultimate Invasion'). Check for artist signatures and dates (like Skottie Young 2025). Return ONLY a raw JSON object. The JSON must have these exact keys: 'title' (exact text from logo), 'issue' (number), 'publisher', 'year', 'rarity' (variant details/artist/condition), and 'price' (estimated raw value like '$15.00'). Do NOT guess the title based on art style; read the literal text.";

                    // UPGRADED TO GEMINI 3.6 FLASH
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: strictPrompt },
                                    { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                                ]
                            }],
                            generationConfig: {
                                temperature: 0.1, // Low temperature for factual OCR-like behavior
                            }
                        })
                    });

                    const data = await response.json();
                    
                    if (data.error) {
                        throw new Error(data.error.message);
                    }

                    let textResponse = data.candidates[0].content.parts[0].text;
                    // Clean up markdown formatting if AI includes it
                    textResponse = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
                    
                    const comicData = JSON.parse(textResponse);
                    comicData.source = "AI Scan";
                    onResult(comicData);
                    
                } catch (err) {
                    setError(`Analysis Failed: ${err.message}. Please ensure the cover is clearly visible and your key is valid.`);
                } finally {
                    setIsScanning(false);
                }
            };

            return (
                <div className="flex flex-col gap-4">
                    {error && (
                        <div className="bg-red-900/50 border border-red-500 text-red-200 p-3 rounded-lg text-sm text-center">
                            {error}
                        </div>
                    )}
                    <div className="relative rounded-xl overflow-hidden bg-black aspect-[3/4] max-h-[60vh] w-full border border-slate-700">
                        <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover" />
                        <div className="scanner-overlay"></div>
                        <div className="absolute top-[10%] left-[10%] right-[10%] bottom-[10%] border-2 border-dashed border-indigo-400/50 rounded-lg pointer-events-none"></div>
                        {isScanning && <div className="scan-line"></div>}
                    </div>
                    <button 
                        onClick={captureAndAnalyze}
                        disabled={isScanning}
                        className="w-full py-4 bg-purple-600 hover:bg-purple-500 text-white rounded-xl font-bold flex items-center justify-center gap-2 transition-colors disabled:opacity-50"
                    >
                        {isScanning ? <Icons.Loader /> : <Icons.Camera />}
                        {isScanning ? 'Analyzing Cover...' : 'Scan Cover with AI'}
                    </button>
                </div>
            );
        };

        const BarcodeScanner = ({ onResult }) => {
            const [isScanning, setIsScanning] = useState(false);
            const scannerRef = useRef(null);

            const startScanner = async () => {
                setIsScanning(true);
                // Slight delay to allow DOM to render the reader div
                setTimeout(() => {
                    const html5QrCode = new Html5Qrcode("reader");
                    scannerRef.current = html5QrCode;
                    
                    html5QrCode.start(
                        { facingMode: "environment" },
                        { fps: 10, qrbox: { width: 250, height: 100 } },
                        (decodedText) => {
                            // On successful scan, stop the camera and return mock data
                            html5QrCode.stop().then(() => {
                                setIsScanning(false);
                                // Mock data for barcode
                                onResult({
                                    title: "Mock Barcode Result",
                                    issue: "#" + decodedText.slice(-3),
                                    publisher: "Indie",
                                    year: "2024",
                                    rarity: "Standard Edition",
                                    price: "$4.99",
                                    source: `Barcode (${decodedText})`
                                });
                            });
                        },
                        (errorMessage) => {
                            // Ignore continuous scanning errors
                        }
                    ).catch((err) => {
                        console.error(err);
                        setIsScanning(false);
                    });
                }, 100);
            };

            const stopScanner = () => {
                if (scannerRef.current) {
                    scannerRef.current.stop().then(() => {
                        setIsScanning(false);
                    }).catch(console.error);
                }
            };

            useEffect(() => {
                return () => {
                    if (scannerRef.current && isScanning) {
                        scannerRef.current.stop().catch(console.error);
                    }
                };
            }, [isScanning]);

            return (
                <div className="flex flex-col gap-4">
                    {isScanning ? (
                        <>
                            <div className="relative rounded-xl overflow-hidden bg-black aspect-square w-full border border-slate-700">
                                <div id="reader" className="w-full h-full"></div>
                                <div className="absolute top-[20%] left-[10%] right-[10%] bottom-[20%] border-2 border-green-400/50 rounded-lg pointer-events-none"></div>
                                <div className="scan-line bg-green-400 box-shadow-green-400"></div>
                            </div>
                            <button 
                                onClick={stopScanner}
                                className="w-full py-4 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold flex items-center justify-center transition-colors"
                            >
                                Stop Camera
                            </button>
                        </>
                    ) : (
                        <div className="glass-panel p-8 rounded-xl flex flex-col items-center justify-center text-center gap-4">
                            <div className="text-slate-400 mb-2"><Icons.Barcode /></div>
                            <h3 className="text-lg font-bold">Ready to Scan UPC</h3>
                            <p className="text-sm text-slate-400 mb-4">Point your camera at the barcode on the cover. (Returns mock data for testing).</p>
                            <button 
                                onClick={startScanner}
                                className="w-full py-4 bg-purple-600 hover:bg-purple-500 text-white rounded-xl font-bold flex items-center justify-center gap-2 transition-colors"
                            >
                                <Icons.Camera /> Start Barcode Scanner
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('ai');
            const [scannedComic, setScannedComic] = useState(null);
            const [history, setHistory] = useState([]);
            const [showSettings, setShowSettings] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            
            // Settings State
            const [apiKey, setApiKey] = useState(localStorage.getItem('geminiKey') || '');
            const [sheetUrl, setSheetUrl] = useState(localStorage.getItem('sheetUrl') || '');

            const saveSettings = () => {
                localStorage.setItem('geminiKey', apiKey);
                localStorage.setItem('sheetUrl', sheetUrl);
                setShowSettings(false);
            };

            const saveToSheet = async () => {
                setIsSaving(true);
                try {
                    if (sheetUrl) {
                        await fetch(sheetUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(scannedComic)
                        });
                    }
                    setHistory([scannedComic, ...history]);
                    setScannedComic(null);
                } catch (err) {
                    alert("Failed to save to sheet. Saved locally.");
                    setHistory([scannedComic, ...history]);
                    setScannedComic(null);
                } finally {
                    setIsSaving(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-900 pb-20">
                    {/* Header */}
                    <header className="bg-slate-800 p-4 sticky top-0 z-10 border-b border-slate-700 flex justify-between items-center shadow-lg">
                        <div className="flex items-center gap-2 text-purple-400 font-bold text-xl">
                            <Icons.Book /> Comic Scanner AI
                        </div>
                        <button onClick={() => setShowSettings(!showSettings)} className="text-slate-400 hover:text-white p-2">
                            <Icons.Settings />
                        </button>
                    </header>

                    {/* Settings Modal */}
                    {showSettings && (
                        <div className="p-4 bg-slate-800 border-b border-slate-700 shadow-xl">
                            <h3 className="font-bold mb-4 text-white">App Configuration</h3>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">Gemini API Key (Required for AI)</label>
                                    <input 
                                        type="password" 
                                        value={apiKey} 
                                        onChange={(e) => setApiKey(e.target.value)}
                                        className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"
                                        placeholder="AIzaSy..."
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">Google App Script URL (For saving)</label>
                                    <input 
                                        type="url" 
                                        value={sheetUrl} 
                                        onChange={(e) => setSheetUrl(e.target.value)}
                                        className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"
                                        placeholder="https://script.google.com/macros/s/..."
                                    />
                                </div>
                                <button onClick={saveSettings} className="w-full bg-blue-600 py-2 rounded font-bold text-white">
                                    Save Config
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Main Content */}
                    <main className="p-4 max-w-md mx-auto">
                        
                        {/* Result Card overlay */}
                        {scannedComic ? (
                            <div className="glass-panel p-5 rounded-2xl shadow-2xl animate-fade-in border-purple-500/30 border">
                                <div className="flex justify-between items-start mb-4">
                                    <div>
                                        <h2 className="text-2xl font-bold text-white">{scannedComic.title}</h2>
                                        <p className="text-purple-400 font-bold">Issue {scannedComic.issue}</p>
                                    </div>
                                    <div className="bg-emerald-900/50 text-emerald-400 px-3 py-1 rounded-full font-bold border border-emerald-500/30">
                                        {scannedComic.price}
                                    </div>
                                </div>
                                
                                <div className="space-y-3 mb-6 text-sm">
                                    <div className="flex justify-between border-b border-slate-700 pb-2">
                                        <span className="text-slate-400">Publisher</span>
                                        <span className="font-medium text-white">{scannedComic.publisher}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-slate-700 pb-2">
                                        <span className="text-slate-400">Year</span>
                                        <span className="font-medium text-white">{scannedComic.year}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-slate-700 pb-2">
                                        <span className="text-slate-400">Rarity / Key</span>
                                        <span className="font-medium text-right max-w-[60%] text-white">{scannedComic.rarity}</span>
                                    </div>
                                </div>

                                <div className="flex gap-3">
                                    <button 
                                        onClick={() => setScannedComic(null)} 
                                        className="flex-1 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-medium transition-colors"
                                    >
                                        Discard
                                    </button>
                                    <button 
                                        onClick={saveToSheet}
                                        disabled={isSaving}
                                        className="flex-[2] py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold flex items-center justify-center gap-2 transition-colors disabled:opacity-50"
                                    >
                                        {/* CRASH FIX: Wrap Icon in a span so React doesn't crash when state changes */}
                                        <span key="save-icon">
                                            {isSaving ? <Icons.Loader /> : <Icons.Save />}
                                        </span>
                                        {isSaving ? 'Saving...' : 'Save to Collection'}
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <>
                                {/* Tabs */}
                                <div className="flex bg-slate-800 rounded-lg p-1 mb-6 border border-slate-700">
                                    <button 
                                        onClick={() => setActiveTab('ai')}
                                        className={`flex-1 py-2 text-sm font-medium rounded-md flex flex-col items-center gap-1 transition-all ${activeTab === 'ai' ? 'bg-slate-700 text-purple-400 shadow' : 'text-slate-400'}`}
                                    >
                                        <Icons.Camera /> AI Cover
                                    </button>
                                    <button 
                                        onClick={() => setActiveTab('barcode')}
                                        className={`flex-1 py-2 text-sm font-medium rounded-md flex flex-col items-center gap-1 transition-all ${activeTab === 'barcode' ? 'bg-slate-700 text-purple-400 shadow' : 'text-slate-400'}`}
                                    >
                                        <Icons.Barcode /> Barcode
                                    </button>
                                </div>

                                {/* Active Scanner */}
                                {activeTab === 'ai' && <AICoverScanner onResult={setScannedComic} apiKey={apiKey} />}
                                {activeTab === 'barcode' && <BarcodeScanner onResult={setScannedComic} />}
                                
                                {/* Session History */}
                                {history.length > 0 && (
                                    <div className="mt-8">
                                        <h3 className="text-slate-400 text-xs font-bold uppercase tracking-wider mb-3">Session History</h3>
                                        <div className="space-y-2">
                                            {history.map((comic, i) => (
                                                <div key={i} className="bg-slate-800 p-3 rounded-lg border border-slate-700 flex justify-between items-center">
                                                    <div>
                                                        <div className="font-bold text-sm text-white">{comic.title} {comic.issue}</div>
                                                        <div className="text-xs text-slate-400">{comic.year} • {comic.publisher}</div>
                                                    </div>
                                                    <div className="text-emerald-400 font-bold text-sm">{comic.price}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
