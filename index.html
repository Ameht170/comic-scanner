<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comic Scanner AI</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Barcode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Hugging Face Transformers.js (Zero-Cost Client-Side AI) -->
    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.16.1';
        env.allowLocalModels = false;
        window.hfPipeline = pipeline;
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .tab-active { border-bottom: 2px solid #a855f7; color: #a855f7; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Target Google Sheet Configuration ("comic list updated 10092026")
        const TARGET_SHEET_URL = "https://docs.google.com/spreadsheets/d/1F_URHBLxEHwZaq0LvEZLUMeBZ2eYXVCeuFDH0DkRHdo/edit?gid=261238410#gid=261238410";
        const TARGET_SHEET_GID = 261238410;
        const SHEET_HEADERS = ["m", "TITLE", "ISSUE", "PUBLISHER", "YEAR", "RARITY", "PRICE", "SOURCE", "", "", "Cover"];

        // High-Quota Production Model Cascade (Each model has its own independent rate-limit bucket)
        const MODEL_CASCADE = [
            "gemini-2.5-flash",
            "gemini-2.5-flash-lite",
            "gemini-2.0-flash",
            "gemini-3-flash-preview"
        ];

        const formatSheetTimestamp = () => {
            const now = new Date();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const year = now.getFullYear();
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');
            return `${month}/${day}/${year} ${hours}:${mins}:${secs}`;
        };

        const parseKeyList = (keyString) => {
            if (!keyString) return [];
            return keyString.split(',').map(k => k.trim()).filter(Boolean);
        };

        // Robust JSON extractor to safely parse responses whether in JSON mode or Search Grounding mode
        const extractCleanJSON = (rawText) => {
            if (!rawText) throw new Error("Empty response from AI.");
            const cleaned = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
            const firstBrace = cleaned.indexOf('{');
            const lastBrace = cleaned.lastIndexOf('}');
            if (firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace) {
                return JSON.parse(cleaned.substring(firstBrace, lastBrace + 1));
            }
            return JSON.parse(cleaned);
        };

        // Decode 5-digit Direct Market Barcode Add-on (IIIVP: Issue 1-3, Variant 4, Printing 5)
        const decodeFiveDigitAddon = (addonStr) => {
            if (!addonStr) return null;
            const digits = addonStr.replace(/\D/g, '');
            if (digits.length !== 5) return null;
            const issueNum = parseInt(digits.substring(0, 3), 10).toString();
            const variantCode = parseInt(digits.substring(3, 4), 10);
            const printingCode = parseInt(digits.substring(4, 5), 10);
            const coverLetter = variantCode >= 1 && variantCode <= 26 ? String.fromCharCode(64 + variantCode) : 'Unknown';
            const printingLabel = printingCode === 1 ? '1st Print' : `${printingCode}th/Subsequent Print`;
            return {
                raw: digits,
                issue: issueNum,
                coverVariant: `Cover ${coverLetter} (Variant Digit: ${variantCode})`,
                printing: printingLabel
            };
        };

        // Zero-Wait Multi-Model & Multi-Key Cascade Caller
        const callGeminiSmartCascade = async ({ apiKeyString, preferredModel, parts, onStatusUpdate, useSearch = false }) => {
            const keys = parseKeyList(apiKeyString);
            if (keys.length === 0) {
                throw new Error("Please add your Gemini API Key in Settings first.");
            }

            // Build ordered model list starting with user's preferred model
            const orderedModels = [
                preferredModel || MODEL_CASCADE[0],
                ...MODEL_CASCADE.filter(m => m !== (preferredModel || MODEL_CASCADE[0]))
            ];

            let lastError = null;

            for (let mIdx = 0; mIdx < orderedModels.length; mIdx++) {
                const modelName = orderedModels[mIdx];

                for (let kIdx = 0; kIdx < keys.length; kIdx++) {
                    const activeKey = keys[kIdx];
                    const requestBody = { contents: [{ parts }] };

                    if (useSearch) {
                        requestBody.tools = [{ google_search: {} }];
                    } else {
                        requestBody.generationConfig = { responseMimeType: "application/json" };
                    }

                    try {
                        const response = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${activeKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(requestBody)
                            }
                        );

                        const data = await response.json();

                        // If Search Grounding caused a 429 or 400 (Search tool has a tiny separate quota), immediately retry this exact model WITHOUT search tool
                        if ((response.status === 429 || response.status === 400 || data.error) && useSearch) {
                            console.warn(`[${modelName}] Search Grounding quota/tool rejected, falling back to fast standard mode...`);
                            const noSearchBody = {
                                contents: [{ parts }],
                                generationConfig: { responseMimeType: "application/json" }
                            };
                            const retryRes = await fetch(
                                `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${activeKey}`,
                                {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(noSearchBody)
                                }
                            );
                            const retryData = await retryRes.json();
                            if (retryRes.ok && retryData.candidates?.[0]?.content?.parts) {
                                const textPart = retryData.candidates[0].content.parts.map(p => p.text || '').join('\n');
                                return {
                                    json: extractCleanJSON(textPart),
                                    sources: [],
                                    modelUsed: modelName
                                };
                            }
                        }

                        // If rate-limited (429 / 503 / quota), DO NOT sleep 8s — immediately jump to next key or next model in cascade!
                        if (
                            response.status === 429 ||
                            response.status === 503 ||
                            (data.error && (
                                data.error.message.toLowerCase().includes('quota') ||
                                data.error.message.toLowerCase().includes('rate') ||
                                data.error.message.toLowerCase().includes('exhausted') ||
                                data.error.message.toLowerCase().includes('overloaded')
                            ))
                        ) {
                            lastError = new Error(data.error?.message || `Quota reached on ${modelName}`);
                            const nextModel = orderedModels[mIdx + 1] || orderedModels[0];
                            if (onStatusUpdate) {
                                onStatusUpdate(`Switching to ${nextModel}...`);
                            }
                            continue;
                        }

                        // If model name not found on endpoint (404), skip to next model immediately
                        if (response.status === 404) {
                            lastError = new Error(`Model ${modelName} unavailable`);
                            continue;
                        }

                        if (data.error) {
                            throw new Error(data.error.message);
                        }

                        const candidate = data.candidates && data.candidates[0];
                        if (!candidate || !candidate.content || !candidate.content.parts) {
                            throw new Error("No valid analysis returned from Gemini.");
                        }

                        const textPart = candidate.content.parts.map(p => p.text || '').join('\n');
                        const groundingChunks = candidate.groundingMetadata?.groundingChunks || [];
                        const sources = groundingChunks
                            .map(c => c.web?.title || c.web?.uri)
                            .filter(Boolean);

                        return {
                            json: extractCleanJSON(textPart),
                            sources: [...new Set(sources)],
                            modelUsed: modelName
                        };
                    } catch (err) {
                        lastError = err;
                    }
                }
            }

            throw lastError || new Error("All Gemini models in cascade reached quota. Check your API key in Settings.");
        };

        const Icons = {
            Camera: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
            Barcode: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4m16-6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V6z"></path></svg>,
            Manual: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 20h9M3 20h9M3 14h18M3 8h18M5 8v12M19 8v12"></path></svg>,
            Settings: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
            Save: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>,
            Spinner: () => <svg className="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>,
            Book: () => <svg className="w-7 h-7 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>,
            Sheet: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>,
            Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        };

        const AICoverScanner = ({ apiKeyString, preferredModel, onResult, onError }) => {
            const [scanning, setScanning] = React.useState(false);
            const [statusText, setStatusText] = React.useState('Scan Cover with AI');
            const [imageSrc, setImageSrc] = React.useState(null);
            const videoRef = React.useRef(null);
            const streamRef = React.useRef(null);
            const classifierRef = React.useRef(null);

            const startCamera = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
                    });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                    }
                    streamRef.current = stream;
                } catch (err) {
                    onError("Could not access camera. Please check permissions.");
                }
            };

            React.useEffect(() => {
                startCamera();
                return () => {
                    if (streamRef.current) {
                        streamRef.current.getTracks().forEach(track => track.stop());
                    }
                };
            }, []);

            const captureAndScan = async () => {
                if (parseKeyList(apiKeyString).length === 0) {
                    onError("Please add your Gemini API Key in Settings first.");
                    return;
                }
                if (!videoRef.current) return;

                setScanning(true);
                
                // 800px @ 0.75 JPEG keeps barcode numbers crisp while cutting token payload in half to avoid TPM rate limits
                const canvas = document.createElement('canvas');
                const targetWidth = 800;
                const scale = targetWidth / (videoRef.current.videoWidth || targetWidth);
                canvas.width = targetWidth;
                canvas.height = (videoRef.current.videoHeight || 1066) * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
                const base64Image = dataUrl.split(',')[1];
                setImageSrc(dataUrl);

                try {
                    // --- STEP 1: Fast Local Pre-Check ---
                    if (window.hfPipeline) {
                        setStatusText('Verifying cover locally...');
                        if (!classifierRef.current) {
                            classifierRef.current = await window.hfPipeline('image-classification', 'Xenova/vit-base-patch16-224');
                        }
                        const predictions = await classifierRef.current(dataUrl);
                        
                        const looksLikeCover = predictions.some(p => 
                            p.label.toLowerCase().includes('comic') || 
                            p.label.toLowerCase().includes('book') || 
                            p.label.toLowerCase().includes('jacket') || 
                            p.label.toLowerCase().includes('poster') ||
                            p.label.toLowerCase().includes('paper') ||
                            p.label.toLowerCase().includes('magazine')
                        );

                        if (!looksLikeCover && predictions[0].score > 0.65) {
                            throw new Error(`Local check failed: Detected "${predictions[0].label}". Please aim directly at a comic cover.`);
                        }
                    }

                    // --- STEP 2: High-Speed Vision Pass (Uses high-quota JSON mode first so it NEVER hits Search Grounding rate limits unnecessarily) ---
                    setStatusText('Analyzing Cover & Barcode...');
                    
                    const visionPrompt = `Act as an expert comic book archivist and market appraiser (Current Date: October 2026).
Analyze this comic book cover image carefully.

CRITICAL INSPECTION STEPS:
1. TRADE DRESS & CREDITS: Read the exact title printed on the cover (e.g., "Midnight X-Men", "Amazing Spider-Man", etc.), issue number, publisher logo (Marvel Comics, DC Comics, Image Comics, etc.), and any visible creator/artist names or signatures.
2. BARCODE & 5-DIGIT DIRECT MARKET ADD-ON: Look at the corners for a UPC barcode box. Extract both the 12-digit main UPC ("barcode_full") AND the 5-digit supplemental code ("barcode_addon_5digit", Format IIIVP: digits 1-3 = Issue #, digit 4 = Cover Variant letter [1=A, 2=B, 3=C], digit 5 = Printing [1=1st print]).
3. VARIANT & ERA IDENTIFICATION: If this is a modern 2025/2026 release and no older year is printed, set "year" to "2026". Describe the cover type (e.g., "Standard Cover A", "Variant Cover", horror/homage/foil style, and cover artist if visibly credited or unmistakable) in "rarity".
4. PRICE TRAP: Place the printed face value (e.g., "$3.99", "$4.99") in "original_cover_price".
5. CURRENT MARKET VALUE: Estimate today's current secondary market collector value for a raw copy in US Dollars formatted as "$XX.XX" and place it strictly in "price".
6. FALLBACK TRIGGER: Set "needs_fallback_search" to true ONLY if the title is completely obscured/virgin OR if a 5-digit barcode add-on is visible on a brand-new 2026 variant and you need web search to confirm the exact variant artist name.

Return ONLY valid JSON with these exact keys:
{
  "title": "string",
  "issue": "string",
  "publisher": "string",
  "year": "string",
  "rarity": "string",
  "original_cover_price": "string",
  "price": "string",
  "cover_url": "string",
  "barcode_full": "string",
  "barcode_addon_5digit": "string",
  "trade_dress_text": "string",
  "needs_fallback_search": false
}`;

                    let { json: resultJson, sources, modelUsed } = await callGeminiSmartCascade({
                        apiKeyString,
                        preferredModel,
                        parts: [
                            { text: visionPrompt },
                            { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                        ],
                        onStatusUpdate: setStatusText,
                        useSearch: false
                    });

                    // --- STEP 3: Optional Grounded Search Enrichment (Non-blocking: if Search quota is full, it keeps Step 2's result!) ---
                    const addonDecoded = decodeFiveDigitAddon(resultJson.barcode_addon_5digit);
                    const needsSearch =
                        resultJson.needs_fallback_search === true ||
                        !resultJson.title ||
                        resultJson.title.toLowerCase().includes('unknown');

                    if (needsSearch && (resultJson.trade_dress_text || resultJson.title || resultJson.barcode_full)) {
                        try {
                            setStatusText('Cross-checking Oct 2026 release slates...');
                            const fallbackPrompt = `Act as a comic book database researcher (October 2026).
Cross-reference this comic release using Google Search (League of Comic Geeks, PreviewsWorld, CovrPrice):
- Title / Trade Dress: "${resultJson.title || resultJson.trade_dress_text}"
- Issue: "${resultJson.issue || (addonDecoded ? addonDecoded.issue : '1')}"
- Publisher: "${resultJson.publisher || 'Marvel Comics'}"
- Barcode: "${resultJson.barcode_full || ''} ${resultJson.barcode_addon_5digit || ''}" ${addonDecoded ? `(${addonDecoded.coverVariant},${addonDecoded.printing})` : ''}

Return ONLY valid JSON with keys: title, issue, publisher, year, rarity, original_cover_price, price, cover_url, barcode_full, barcode_addon_5digit.`;

                            const fallbackRes = await callGeminiSmartCascade({
                                apiKeyString,
                                preferredModel,
                                parts: [{ text: fallbackPrompt }],
                                onStatusUpdate: setStatusText,
                                useSearch: true
                            });

                            resultJson = { ...resultJson, ...fallbackRes.json };
                            sources = [...new Set([...sources, ...fallbackRes.sources])];
                            modelUsed = fallbackRes.modelUsed;
                        } catch (fallbackErr) {
                            console.warn("Optional search enrichment skipped, keeping primary vision result:", fallbackErr);
                        }
                    }

                    if (addonDecoded && resultJson.rarity && !resultJson.rarity.includes(addonDecoded.raw)) {
                        resultJson.rarity = `${resultJson.rarity} (${addonDecoded.coverVariant}, ${addonDecoded.printing})`;
                    }

                    resultJson.source = "AI Scan";
                    resultJson.notes = addonDecoded ? `Barcode Add-On: ${addonDecoded.raw}` : (resultJson.barcode_full || '');
                    resultJson.model_used = modelUsed;

                    if (sources.length > 0) {
                        resultJson.grounding_sources = sources.slice(0, 3).join(', ');
                    }

                    onResult(resultJson);
                } catch (err) {
                    console.error(err);
                    onError(err.message || "Failed to analyze image. Ensure your key is valid and the text is clear.");
                    setImageSrc(null); 
                } finally {
                    setScanning(false);
                    setStatusText('Scan Cover with AI');
                }
            };

            return (
                <div className="relative rounded-xl overflow-hidden bg-black shadow-lg">
                    {!imageSrc ? (
                        <video ref={videoRef} autoPlay playsInline className="w-full h-[58vh] object-cover"></video>
                    ) : (
                        <img src={imageSrc} className="w-full h-[58vh] object-cover opacity-50" alt="Captured" />
                    )}
                    
                    {!imageSrc && (
                        <div className="absolute inset-0 border-2 border-dashed border-purple-500/50 m-6 rounded-lg pointer-events-none flex flex-col justify-between p-3">
                            <span className="text-[10px] bg-black/60 text-purple-300 px-2 py-1 rounded self-start">
                                Include Title Banner + Bottom Barcode Box
                            </span>
                            <div className="border border-amber-400/50 bg-amber-500/10 rounded p-1.5 text-[10px] text-amber-300 text-center">
                                Make sure the 5-digit UPC add-on is in focus for 2026 variants
                            </div>
                        </div>
                    )}

                    <div className="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/90 to-transparent">
                        <button 
                            onClick={captureAndScan} 
                            disabled={scanning}
                            className="w-full py-4 bg-purple-600 hover:bg-purple-700 disabled:bg-purple-800 text-white rounded-xl font-bold flex items-center justify-center gap-2 transition-colors"
                        >
                            {scanning ? <Icons.Spinner /> : <Icons.Camera />}
                            {statusText}
                        </button>
                    </div>
                </div>
            );
        };

        const SafeBarcodeScanner = ({ apiKeyString, preferredModel, onResult, onError }) => {
            const [scanning, setScanning] = React.useState(false);
            const [statusText, setStatusText] = React.useState('Start Barcode Scanner');
            const [manualAddon, setManualAddon] = React.useState('');
            const scannerRef = React.useRef(null);

            const lookupBarcodeViaAI = async (barcode) => {
                if (parseKeyList(apiKeyString).length === 0) {
                    onError("Please add your Gemini API Key in Settings to enable Live Barcode Lookups.");
                    setScanning(false);
                    return;
                }
                
                const fullCode = manualAddon.trim() ? `${barcode}${manualAddon.trim()}` : barcode;
                const addonPart = fullCode.length >= 17 ? fullCode.slice(-5) : (manualAddon.trim().length === 5 ? manualAddon.trim() : '');
                const decodedAddon = decodeFiveDigitAddon(addonPart);

                setStatusText("Looking up Barcode & Market Value...");
                try {
                    const promptText = `Act as an expert comic book database and appraiser (Current Date: October 2026).
I scanned a comic book UPC barcode: "${fullCode}"
${decodedAddon ? `Decoded 5-Digit Direct Market Add-on (${decodedAddon.raw}): Issue #${decodedAddon.issue}, ${decodedAddon.coverVariant},${decodedAddon.printing}.` : ''}

INSTRUCTIONS:
1. Identify the exact comic title, issue number, publisher, year, and specific cover artist/variant matching the barcode and 5-digit add-on.
2. PRICE TRAP: Place the printed cover price in "original_cover_price".
3. Place TODAY'S CURRENT SECONDARY MARKET COLLECTOR VALUE for a raw copy in US Dollars ("$XX.XX") strictly in "price".
4. If available, include a direct public image URL for the cover in "cover_url".

Return ONLY valid JSON with keys: title, issue, publisher, year, rarity, original_cover_price, price, cover_url, barcode_full, barcode_addon_5digit.`;

                    const { json: resultJson, sources, modelUsed } = await callGeminiSmartCascade({
                        apiKeyString,
                        preferredModel,
                        parts: [{ text: promptText }],
                        onStatusUpdate: setStatusText,
                        useSearch: true
                    });

                    resultJson.barcode_full = fullCode;
                    resultJson.source = "Barcode Scan";
                    resultJson.notes = `UPC: ${fullCode}`;
                    resultJson.model_used = modelUsed;
                    if (decodedAddon && !resultJson.barcode_addon_5digit) {
                        resultJson.barcode_addon_5digit = decodedAddon.raw;
                    }
                    if (sources.length > 0) {
                        resultJson.grounding_sources = sources.slice(0, 3).join(', ');
                    }
                    
                    setScanning(false);
                    setStatusText("Start Barcode Scanner");
                    onResult(resultJson);
                    
                } catch (err) {
                    console.error(err);
                    onError(err.message || "Failed to lookup barcode in database. Try again.");
                    setScanning(false);
                    setStatusText("Start Barcode Scanner");
                } 
            };

            const startScanning = () => {
                setScanning(true);
                setStatusText("Awaiting Barcode...");
                setTimeout(() => {
                    const scanner = new Html5Qrcode("reader");
                    scannerRef.current = scanner;
                    scanner.start(
                        { facingMode: "environment" },
                        { fps: 10, qrbox: { width: 260, height: 150 } },
                        (decodedText) => {
                            scanner.stop().then(() => {
                                lookupBarcodeViaAI(decodedText);
                            }).catch(err => {
                                console.error("Camera stop error (ignored):", err);
                                lookupBarcodeViaAI(decodedText);
                            });
                        },
                        (err) => { /* ignore continuous stream errors */ }
                    ).catch(err => {
                        onError("Camera blocked or unavailable.");
                        setScanning(false);
                        setStatusText("Start Barcode Scanner");
                    });
                }, 150);
            };

            const stopScanning = () => {
                if (scannerRef.current) {
                    scannerRef.current.stop().then(() => {
                        setScanning(false);
                        setStatusText("Start Barcode Scanner");
                    }).catch(console.error);
                } else {
                    setScanning(false);
                    setStatusText("Start Barcode Scanner");
                }
            };

            React.useEffect(() => {
                return () => {
                    if (scannerRef.current) {
                        try { scannerRef.current.stop().catch(() => {}); } catch(e) {}
                    }
                };
            }, []);

            return (
                <div className="flex flex-col items-center">
                    {!scanning ? (
                        <div className="text-center w-full mt-4 space-y-4">
                            <p className="text-slate-400 px-2 text-sm">
                                Scan the UPC barcode to perform a live database lookup.
                            </p>
                            <div className="bg-slate-800/80 border border-slate-700 p-3 rounded-xl text-left">
                                <label className="block text-xs font-bold text-purple-400 mb-1">
                                    Optional: 5-Digit Direct Market Add-On (IIIVP)
                                </label>
                                <p className="text-[11px] text-slate-400 mb-2">
                                    Standard cameras sometimes only read the 12-digit main UPC. Enter the 5-digit small code on the right (e.g., <code className="text-amber-300">00121</code> = Issue #1, Cover B, 1st Print) for exact variant matching:
                                </p>
                                <input
                                    type="text"
                                    maxLength={5}
                                    value={manualAddon}
                                    onChange={(e) => setManualAddon(e.target.value.replace(/\D/g, ''))}
                                    placeholder="e.g. 00111"
                                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white font-mono tracking-widest focus:border-purple-500 outline-none"
                                />
                            </div>
                            <button onClick={startScanning} className="w-full py-4 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-bold flex items-center justify-center gap-2 transition-colors">
                                <Icons.Barcode />
                                {statusText}
                            </button>
                        </div>
                    ) : (
                        <div className="w-full flex flex-col items-center mt-4">
                            <div id="reader" className="w-full max-w-md rounded-xl overflow-hidden shadow-2xl bg-black"></div>
                            <p className="mt-4 font-bold text-amber-500 animate-pulse">{statusText}</p>
                            <button onClick={stopScanning} className="mt-6 w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold">
                                Cancel Scanning
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = React.useState('ai');
            const [currentComic, setCurrentComic] = React.useState(null);
            const [history, setHistory] = React.useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('comicScanHistory') || '[]');
                } catch (e) {
                    return [];
                }
            });
            const [apiKey, setApiKey] = React.useState(localStorage.getItem('geminiApiKey') || '');
            const [preferredModel, setPreferredModel] = React.useState(localStorage.getItem('geminiPreferredModel') || 'gemini-2.5-flash');
            const [scriptUrl, setScriptUrl] = React.useState(localStorage.getItem('sheetScriptUrl') || '');
            const [isSaving, setIsSaving] = React.useState(false);
            const [showSettings, setShowSettings] = React.useState(false);
            const [showScriptHelper, setShowScriptHelper] = React.useState(false);
            const [error, setError] = React.useState('');
            const [toast, setToast] = React.useState('');

            const appsScriptBridgeCode = `function doPost(e) {
  var ss = SpreadsheetApp.openByUrl("${TARGET_SHEET_URL}");
  var sheet = ss.getSheets().filter(function(s) { return s.getSheetId() === ${TARGET_SHEET_GID}; })[0] || ss.getActiveSheet();
  var d = JSON.parse(e.postData.contents);
  // Exact 11-column schema: m | TITLE | ISSUE | PUBLISHER | YEAR | RARITY | PRICE | SOURCE | Notes | Spacer | Cover
  sheet.appendRow([
    d.timestamp || Utilities.formatDate(new Date(), "America/New_York", "M/d/yyyy HH:mm:ss"),
    d.title || "",
    d.issue || "",
    d.publisher || "",
    d.year || "",
    d.rarity || "",
    d.price || "",
    d.source || "AI Scan",
    d.notes || "",
    "",
    d.cover_url || ""
  ]);
  return ContentService.createTextOutput(JSON.stringify({ status: "ok" })).setMimeType(ContentService.MimeType.JSON);
}`;

            const handleKeyUpdate = (e) => {
                const val = e.target.value;
                setApiKey(val);
                localStorage.setItem('geminiApiKey', val);
            };

            const handleModelUpdate = (e) => {
                const val = e.target.value;
                setPreferredModel(val);
                localStorage.setItem('geminiPreferredModel', val);
            };

            const handleUrlUpdate = (e) => {
                const val = e.target.value;
                setScriptUrl(val);
                localStorage.setItem('sheetScriptUrl', val);
            };

            const triggerError = (msg) => {
                setError(msg);
                setTimeout(() => setError(''), 6000);
            };

            const triggerToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 4000);
            };

            const updateHistory = (newEntry) => {
                const updated = [newEntry, ...history];
                setHistory(updated);
                try {
                    localStorage.setItem('comicScanHistory', JSON.stringify(updated));
                } catch (e) {}
            };

            // Export Session History as CSV with the exact 11-column headers of comic list updated 10092026
            const exportMatchingCSV = () => {
                if (history.length === 0) {
                    triggerError("Scan at least one comic first to export CSV.");
                    return;
                }
                const escapeCSV = (val) => `"${String(val ?? '').replace(/"/g, '""')}"`;
                const rows = [
                    SHEET_HEADERS.map(escapeCSV).join(','),
                    ...history.map(item => [
                        item.timestamp || formatSheetTimestamp(),
                        item.title || '',
                        item.issue || '',
                        item.publisher || '',
                        item.year || '',
                        item.rarity || '',
                        item.price || '',
                        item.source || 'AI Scan',
                        item.notes || '',
                        '',
                        item.cover_url || ''
                    ].map(escapeCSV).join(','))
                ];
                const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', `comic_list_updated_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                triggerToast("Downloaded CSV with exact 11-column Sheet headers!");
            };

            const saveToSheet = async () => {
                const timestamp = formatSheetTimestamp();
                const enrichedComic = {
                    ...currentComic,
                    timestamp,
                    source: currentComic.source || "AI Scan"
                };

                if (!scriptUrl) {
                    updateHistory(enrichedComic);
                    setCurrentComic(null);
                    triggerToast("Saved to session history! (Use CSV Export or add Web App URL in Settings for live Sheet sync)");
                    return;
                }

                setIsSaving(true);
                try {
                    const payload = {
                        timestamp: enrichedComic.timestamp,
                        barcode: enrichedComic.barcode_full || enrichedComic.barcode_addon_5digit || "AI_SCAN",
                        title: enrichedComic.title,
                        issue: enrichedComic.issue,
                        publisher: enrichedComic.publisher,
                        year: enrichedComic.year,
                        rarity: enrichedComic.rarity,
                        price: enrichedComic.price,
                        source: enrichedComic.source,
                        notes: enrichedComic.notes || "",
                        cover_url: enrichedComic.cover_url || "",
                        rowArray: [
                            enrichedComic.timestamp,
                            enrichedComic.title || "",
                            enrichedComic.issue || "",
                            enrichedComic.publisher || "",
                            enrichedComic.year || "",
                            enrichedComic.rarity || "",
                            enrichedComic.price || "",
                            enrichedComic.source || "AI Scan",
                            enrichedComic.notes || "",
                            "",
                            enrichedComic.cover_url || ""
                        ]
                    };

                    await fetch(scriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                    
                    updateHistory(enrichedComic);
                    setCurrentComic(null);
                    triggerToast("Logged directly to Google Sheet!");
                } catch (err) {
                    console.error(err);
                    triggerError("Failed to save to Google Sheet. Check Web App URL.");
                } finally {
                    setIsSaving(false);
                }
            };

            return (
                <div className="min-h-screen max-w-md mx-auto flex flex-col relative pb-20">
                    <div className="flex justify-between items-center p-4 border-b border-slate-800 bg-slate-900 sticky top-0 z-10">
                        <div className="flex items-center gap-2">
                            <Icons.Book />
                            <div>
                                <h1 className="text-lg font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent leading-tight">
                                    Comic Scanner AI
                                </h1>
                                <a 
                                    href={TARGET_SHEET_URL} 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    className="text-[10px] text-emerald-400 hover:underline flex items-center gap-1"
                                >
                                    <Icons.Sheet /> Connected: comic list updated 10092026 ↗
                                </a>
                            </div>
                        </div>
                        <button onClick={() => setShowSettings(!showSettings)} className="p-2 text-slate-400 hover:text-white rounded-full transition-colors">
                            <Icons.Settings />
                        </button>
                    </div>

                    {showSettings && (
                        <div className="p-4 bg-slate-800 border-b border-slate-700 animate-fade-in space-y-4">
                            <div className="flex justify-between items-center">
                                <h2 className="font-bold text-purple-400">Configuration & Sheet Sync</h2>
                                <a 
                                    href={TARGET_SHEET_URL} 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    className="text-xs bg-emerald-600/20 border border-emerald-500/40 text-emerald-300 px-2.5 py-1 rounded-lg font-semibold"
                                >
                                    Open Target Sheet ↗
                                </a>
                            </div>

                            <div>
                                <label className="block text-xs text-amber-400 mb-1 font-bold">Gemini API Key(s)</label>
                                <p className="text-[10px] text-slate-400 mb-2 leading-tight">Paste one or multiple keys separated by commas.</p>
                                <input 
                                    type="password" 
                                    value={apiKey}
                                    onChange={handleKeyUpdate}
                                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:border-purple-500 outline-none"
                                    placeholder="AIzaSy..."
                                />
                            </div>

                            <div>
                                <label className="block text-xs text-purple-300 mb-1 font-bold">Primary Gemini Model (Auto-Cascades on Quota)</label>
                                <select
                                    value={preferredModel}
                                    onChange={handleModelUpdate}
                                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:border-purple-500 outline-none"
                                >
                                    <option value="gemini-2.5-flash">gemini-2.5-flash (Recommended • High Quota)</option>
                                    <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite (Fastest • Highest Quota)</option>
                                    <option value="gemini-2.0-flash">gemini-2.0-flash (Stable Fallback)</option>
                                    <option value="gemini-3-flash-preview">gemini-3-flash-preview (Experimental • Low Quota)</option>
                                </select>
                            </div>

                            <div>
                                <div className="flex justify-between items-center mb-1">
                                    <label className="block text-xs text-slate-300 font-semibold">Google Apps Script Web App URL</label>
                                    <button 
                                        onClick={() => setShowScriptHelper(!showScriptHelper)}
                                        className="text-[11px] text-purple-400 hover:underline font-medium"
                                    >
                                        {showScriptHelper ? 'Hide Script Code' : 'Need Apps Script for this Sheet?'}
                                    </button>
                                </div>
                                <input 
                                    type="text" 
                                    value={scriptUrl}
                                    onChange={handleUrlUpdate}
                                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:border-purple-500 outline-none"
                                    placeholder="https://script.google.com/macros/s/.../exec"
                                />
                            </div>

                            {showScriptHelper && (
                                <div className="bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs space-y-2">
                                    <p className="text-slate-300 leading-relaxed">
                                        To auto-append directly into <strong>comic list updated 10092026</strong> (<code className="text-amber-300">A:K</code> schema: <code className="text-purple-300">m, TITLE, ISSUE, PUBLISHER, YEAR, RARITY, PRICE, SOURCE, , , Cover</code>):
                                    </p>
                                    <ol className="list-decimal list-inside text-[11px] text-slate-400 space-y-1">
                                        <li>Open your Sheet → <strong>Extensions → Apps Script</strong></li>
                                        <li>Paste the code below & click <strong>Deploy → New deployment → Web app</strong> (Access: <em>Anyone</em>)</li>
                                        <li>Paste the generated <code className="text-emerald-400">/exec</code> URL above.</li>
                                    </ol>
                                    <pre className="bg-black/80 text-emerald-300 p-2 rounded overflow-x-auto text-[10px] font-mono select-all">
{appsScriptBridgeCode}
                                    </pre>
                                    <button
                                        onClick={() => {
                                            navigator.clipboard.writeText(appsScriptBridgeCode);
                                            triggerToast("Apps Script copied to clipboard!");
                                        }}
                                        className="w-full py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded font-bold text-xs"
                                    >
                                        Copy Apps Script Code
                                    </button>
                                </div>
                            )}

                            <button 
                                onClick={() => setShowSettings(false)}
                                className="w-full bg-purple-600 py-2 rounded-lg text-sm font-bold text-white hover:bg-purple-700 transition-colors"
                            >
                                Close Settings (Auto-Saved)
                            </button>
                        </div>
                    )}

                    {error && (
                        <div className="m-4 p-3 bg-red-900/50 border border-red-500/50 rounded-lg text-red-200 text-sm text-center animate-pulse">
                            {error}
                        </div>
                    )}

                    {toast && (
                        <div className="m-4 p-3 bg-emerald-900/60 border border-emerald-500/50 rounded-lg text-emerald-200 text-xs font-semibold text-center">
                            {toast}
                        </div>
                    )}

                    {!currentComic && (
                        <div className="flex px-4 pt-2 mb-4 bg-slate-900">
                            <button onClick={() => setActiveTab('ai')} className={`flex-1 pb-3 text-sm font-medium flex flex-col items-center gap-1 ${activeTab === 'ai' ? 'tab-active' : 'text-slate-500'}`}>
                                <Icons.Camera /> AI Cover
                            </button>
                            <button onClick={() => setActiveTab('barcode')} className={`flex-1 pb-3 text-sm font-medium flex flex-col items-center gap-1 ${activeTab === 'barcode' ? 'tab-active' : 'text-slate-500'}`}>
                                <Icons.Barcode /> Barcode
                            </button>
                            <button onClick={() => setActiveTab('manual')} className={`flex-1 pb-3 text-sm font-medium flex flex-col items-center gap-1 ${activeTab === 'manual' ? 'tab-active' : 'text-slate-500'}`}>
                                <Icons.Manual /> Manual
                            </button>
                        </div>
                    )}

                    <div className="px-4 flex-grow">
                        {!currentComic ? (
                            <>
                                {activeTab === 'ai' && <AICoverScanner apiKeyString={apiKey} preferredModel={preferredModel} onResult={setCurrentComic} onError={triggerError} />}
                                {activeTab === 'barcode' && <SafeBarcodeScanner apiKeyString={apiKey} preferredModel={preferredModel} onResult={setCurrentComic} onError={triggerError} />}
                                {activeTab === 'manual' && (
                                    <div className="mt-6 space-y-4">
                                        <p className="text-slate-400 text-sm text-center">Manually enter a comic using your exact 11-column Google Sheet structure</p>
                                        <button 
                                            onClick={() => setCurrentComic({
                                                title: "",
                                                issue: "1",
                                                publisher: "Marvel Comics",
                                                year: "2026",
                                                rarity: "Common",
                                                original_cover_price: "$4.99",
                                                price: "$5.00",
                                                source: "Manual",
                                                notes: "",
                                                cover_url: ""
                                            })} 
                                            className="w-full bg-purple-600 py-4 rounded-xl text-white font-bold hover:bg-purple-700 transition-colors"
                                        >
                                            Open Manual Entry Form
                                        </button>
                                    </div>
                                )}
                            </>
                        ) : (
                            <div className="bg-slate-800 rounded-2xl p-5 shadow-2xl border border-slate-700 mt-2 animate-fade-in">
                                <div className="flex justify-between items-start gap-3 mb-4">
                                    <div className="flex-1">
                                        <label className="text-[10px] uppercase text-slate-400 font-bold">Title (Col B)</label>
                                        <input
                                            type="text"
                                            value={currentComic.title || ''}
                                            onChange={(e) => setCurrentComic({ ...currentComic, title: e.target.value })}
                                            placeholder="Comic Series Title"
                                            className="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-2.5 py-1.5 text-lg font-black text-white mt-0.5 outline-none focus:border-purple-500"
                                        />
                                    </div>
                                    <div className="w-28">
                                        <label className="text-[10px] uppercase text-emerald-400 font-bold">Price (Col G)</label>
                                        <input
                                            type="text"
                                            value={currentComic.price || ''}
                                            onChange={(e) => setCurrentComic({ ...currentComic, price: e.target.value })}
                                            className="w-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 rounded-lg px-2.5 py-1.5 text-lg font-bold text-center mt-0.5 outline-none"
                                        />
                                    </div>
                                </div>

                                <div className="grid grid-cols-3 gap-2 mb-3 text-sm">
                                    <div>
                                        <label className="text-[10px] uppercase text-slate-400 font-bold">Issue (Col C)</label>
                                        <input
                                            type="text"
                                            value={currentComic.issue || ''}
                                            onChange={(e) => setCurrentComic({ ...currentComic, issue: e.target.value })}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white font-bold mt-0.5 outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] uppercase text-slate-400 font-bold">Publisher (Col D)</label>
                                        <input
                                            type="text"
                                            value={currentComic.publisher || ''}
                                            onChange={(e) => setCurrentComic({ ...currentComic, publisher: e.target.value })}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white font-medium mt-0.5 outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] uppercase text-slate-400 font-bold">Year (Col E)</label>
                                        <input
                                            type="text"
                                            value={currentComic.year || ''}
                                            onChange={(e) => setCurrentComic({ ...currentComic, year: e.target.value })}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white font-medium mt-0.5 outline-none"
                                        />
                                    </div>
                                </div>

                                <div className="space-y-2.5 text-sm">
                                    <div>
                                        <label className="text-[10px] uppercase text-slate-400 font-bold">Rarity / Variant / Artist (Col F)</label>
                                        <input
                                            type="text"
                                            value={currentComic.rarity || ''}
                                            onChange={(e) => setCurrentComic({ ...currentComic, rarity: e.target.value })}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white mt-0.5 outline-none"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-[10px] uppercase text-slate-400 font-bold">Source (Col H)</label>
                                            <input
                                                type="text"
                                                value={currentComic.source || 'AI Scan'}
                                                onChange={(e) => setCurrentComic({ ...currentComic, source: e.target.value })}
                                                className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-300 text-xs mt-0.5 outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[10px] uppercase text-slate-400 font-bold">Notes / Barcode (Col I)</label>
                                            <input
                                                type="text"
                                                value={currentComic.notes || ''}
                                                onChange={(e) => setCurrentComic({ ...currentComic, notes: e.target.value })}
                                                placeholder="Signed, 5-digit add-on..."
                                                className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-amber-300 text-xs font-mono mt-0.5 outline-none"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-[10px] uppercase text-slate-400 font-bold">Cover Image URL (Col K)</label>
                                        <input
                                            type="text"
                                            value={currentComic.cover_url || ''}
                                            onChange={(e) => setCurrentComic({ ...currentComic, cover_url: e.target.value })}
                                            placeholder="https://..."
                                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-300 text-xs font-mono mt-0.5 outline-none"
                                        />
                                    </div>

                                    <div className="pt-1 text-[10px] text-slate-400 flex justify-between items-center">
                                        <span>Engine: <strong className="text-emerald-400">{currentComic.model_used || preferredModel}</strong></span>
                                        {currentComic.grounding_sources && (
                                            <span className="text-purple-300 truncate max-w-[60%] text-right">Verified: {currentComic.grounding_sources}</span>
                                        )}
                                    </div>
                                </div>

                                <div className="flex gap-3 mt-6">
                                    <button 
                                        onClick={() => setCurrentComic(null)} 
                                        className="w-1/3 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold transition-colors"
                                    >
                                        Discard
                                    </button>
                                    <button 
                                        onClick={saveToSheet} 
                                        disabled={isSaving}
                                        className="w-2/3 py-3 bg-emerald-600 disabled:bg-emerald-800 hover:bg-emerald-500 text-white rounded-xl font-bold flex items-center justify-center gap-2 transition-colors shadow-lg shadow-emerald-900/50"
                                    >
                                        <span key={isSaving ? 'spin' : 'save'} className="flex items-center gap-2">
                                            {isSaving ? <Icons.Spinner /> : <Icons.Save />} 
                                            {isSaving ? 'Saving...' : 'Save to Sheet'}
                                        </span>
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    {!currentComic && history.length > 0 && (
                        <div className="px-4 mt-6">
                            <div className="flex justify-between items-center mb-3">
                                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider">
                                    Scanned Comics ({history.length})
                                </h3>
                                <div className="flex gap-2">
                                    <button
                                        onClick={exportMatchingCSV}
                                        className="text-xs bg-purple-600/20 border border-purple-500/40 hover:bg-purple-600/30 text-purple-300 px-2.5 py-1 rounded-lg font-semibold flex items-center gap-1 transition-colors"
                                    >
                                        <Icons.Download /> Export Sheet CSV
                                    </button>
                                </div>
                            </div>
                            <div className="space-y-2.5">
                                {history.map((comic, idx) => (
                                    <div key={idx} className="bg-slate-800/60 border border-slate-700 p-3 rounded-lg flex justify-between items-center gap-2">
                                        <div className="min-w-0">
                                            <p className="font-bold text-sm text-white truncate">{comic.title} #{comic.issue}</p>
                                            <p className="text-xs text-slate-400 truncate">{comic.publisher} ({comic.year}) • {comic.rarity}</p>
                                            <p className="text-[10px] text-slate-500 font-mono">{comic.timestamp}</p>
                                        </div>
                                        <p className="text-emerald-400 font-bold text-sm whitespace-nowrap">{comic.price}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
