<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comic Scanner AI</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Barcode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .tab-active { border-bottom: 2px solid #a855f7; color: #a855f7; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- SVG Icons (Crash-Proof) ---
        const Icons = {
            Camera: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
            Barcode: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4m16-6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V6z"></path></svg>,
            Manual: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 20h9M3 20h9M3 14h18M3 8h18M5 8v12M19 8v12"></path></svg>,
            Settings: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
            Save: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>,
            Spinner: () => <svg className="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>,
            Book: () => <svg className="w-7 h-7 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        };

        // --- Components ---
        const AICoverScanner = ({ apiKey, onResult, onError }) => {
            const [scanning, setScanning] = React.useState(false);
            const [imageSrc, setImageSrc] = React.useState(null);
            const videoRef = React.useRef(null);
            const streamRef = React.useRef(null);

            const startCamera = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                    }
                    streamRef.current = stream;
                } catch (err) {
                    onError("Could not access camera. Please check permissions.");
                }
            };

            React.useEffect(() => {
                startCamera();
                return () => {
                    if (streamRef.current) {
                        streamRef.current.getTracks().forEach(track => track.stop());
                    }
                };
            }, []);

            const captureAndScan = async () => {
                if (!apiKey) {
                    onError("Please add your Gemini API Key in Settings first.");
                    return;
                }
                if (!videoRef.current) return;

                setScanning(true);
                const canvas = document.createElement('canvas');
                // Resize image to prevent memory crash
                const scale = 800 / videoRef.current.videoWidth;
                canvas.width = 800;
                canvas.height = videoRef.current.videoHeight * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
                const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                setImageSrc(canvas.toDataURL('image/jpeg', 0.8));

                try {
                    // Restored back to the correct 3.6 model!
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "Act strictly as an OCR text scanner. Analyze this comic book cover. Read the title, issue number, publisher, and year literally from the text printed on the cover. Do not hallucinate or guess the comic based on the art style, only use the printed words. Estimate a raw condition market price. Return ONLY valid JSON with keys: title, issue, publisher, year, rarity, price." },
                                    { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                                ]
                            }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    
                    const data = await response.json();
                    
                    // 1. Catch API-level errors (like invalid keys or Rate Limits)
                    if (data.error) {
                        throw new Error(data.error.message);
                    }
                    
                    // 2. Catch Safety blocks (e.g. violent comic covers being blocked by AI)
                    if (!data.candidates || data.candidates.length === 0 || !data.candidates[0].content) {
                        throw new Error("AI rejected the image (likely triggered by safety filters on the cover art).");
                    }
                    
                    let resultText = data.candidates[0].content.parts[0].text;
                    
                    // 3. Clean up formatting (Sometimes the AI returns ```json even with strict rules)
                    resultText = resultText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    
                    const resultJson = JSON.parse(resultText);
                    onResult(resultJson);
                    
                } catch (err) {
                    console.error("Scan Error:", err);
                    
                    // Route the specific error message to the UI
                    let errorMessage = "Failed to analyze image. Ensure the text on the cover is clear.";
                    if (err.message.includes("quota") || err.message.includes("429")) {
                        errorMessage = "Rate limit reached. Please wait a minute before scanning again.";
                    } else if (err.name === "SyntaxError" || err.message.includes("JSON")) {
                        errorMessage = "AI returned malformed data. Please rescan.";
                    } else if (err.message) {
                        errorMessage = err.message; // Uses our custom safety/API errors from above
                    }
                    
                    onError(errorMessage);
                    setImageSrc(null); // Reset image on error so they can try again
                } finally {
                    setScanning(false);
                }
            };

            return (
                <div className="relative rounded-xl overflow-hidden bg-black shadow-lg">
                    {!imageSrc ? (
                        <video ref={videoRef} autoPlay playsInline className="w-full h-[60vh] object-cover"></video>
                    ) : (
                        <img src={imageSrc} className="w-full h-[60vh] object-cover opacity-50" alt="Captured" />
                    )}
                    
                    {!imageSrc && (
                        <div className="absolute inset-0 border-2 border-dashed border-purple-500/50 m-8 rounded-lg pointer-events-none"></div>
                    )}

                    <div className="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/90 to-transparent">
                        <button 
                            onClick={captureAndScan} 
                            disabled={scanning}
                            className="w-full py-4 bg-purple-600 disabled:bg-purple-800 hover:bg-purple-700 text-white rounded-xl font-bold flex items-center justify-center gap-2 transition-colors"
                        >
                            {scanning ? <Icons.Spinner /> : <Icons.Camera />}
                            {scanning ? 'Analyzing Cover text...' : 'Scan Cover with AI'}
                        </button>
                    </div>
                </div>
            )
        };

        const SafeBarcodeScanner = ({ onResult, onError }) => {
            const [scanning, setScanning] = React.useState(false);
            const scannerRef = React.useRef(null);

            const startScanning = () => {
                setScanning(true);
                // Slight delay ensures the div is rendered before attaching camera
                setTimeout(() => {
                    const scanner = new Html5Qrcode("reader");
                    scannerRef.current = scanner;
                    scanner.start(
                        { facingMode: "environment" },
                        { fps: 10, qrbox: { width: 250, height: 150 } },
                        (decodedText) => {
                            // CRITICAL FIX: Stop the camera completely BEFORE updating parent state
                            scanner.stop().then(() => {
                                setScanning(false);
                                onResult(decodedText);
                            }).catch(err => {
                                console.error("Camera stop error (ignored):", err);
                                setScanning(false);
                                onResult(decodedText);
                            });
                        },
                        (err) => { /* ignore continuous stream errors */ }
                    ).catch(err => {
                        onError("Camera blocked or unavailable.");
                        setScanning(false);
                    });
                }, 150);
            };

            const stopScanning = () => {
                if (scannerRef.current) {
                    scannerRef.current.stop().then(() => setScanning(false)).catch(console.error);
                } else {
                    setScanning(false);
                }
            };

            // Emergency cleanup on unmount
            React.useEffect(() => {
                return () => {
                    if (scannerRef.current) {
                        try { scannerRef.current.stop().catch(() => {}); } catch(e) {}
                    }
                };
            }, []);

            return (
                <div className="flex flex-col items-center">
                    {!scanning ? (
                        <div className="text-center w-full mt-10">
                            <p className="text-slate-400 mb-6 px-4 text-sm">Scan the UPC barcode. Note: Because standard barcode APIs require paid keys, this uses a smart mock generator for testing.</p>
                            <button onClick={startScanning} className="w-full py-4 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-bold flex items-center justify-center gap-2 transition-colors">
                                <Icons.Barcode />
                                Start Barcode Scanner
                            </button>
                        </div>
                    ) : (
                        <div className="w-full flex flex-col items-center mt-4">
                            <div id="reader" className="w-full max-w-md rounded-xl overflow-hidden shadow-2xl bg-black"></div>
                            <button onClick={stopScanning} className="mt-6 w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold">
                                Cancel Scanning
                            </button>
                        </div>
                    )}
                </div>
            );
        };


        // --- Main App ---
        const App = () => {
            const [activeTab, setActiveTab] = React.useState('ai');
            const [currentComic, setCurrentComic] = React.useState(null);
            const [history, setHistory] = React.useState([]);
            const [apiKey, setApiKey] = React.useState(localStorage.getItem('geminiApiKey') || '');
            const [scriptUrl, setScriptUrl] = React.useState(localStorage.getItem('sheetScriptUrl') || '');
            const [isSaving, setIsSaving] = React.useState(false);
            const [showSettings, setShowSettings] = React.useState(false);
            const [error, setError] = React.useState('');

            const triggerError = (msg) => {
                setError(msg);
                setTimeout(() => setError(''), 6000); // Extended timeout slightly so it can be read
            };

            const handleBarcodeScan = (barcode) => {
                // Mock database with your exact scanned comic + dynamic fallback
                const mockDb = {
                    "759606213368": { title: "Ultimate Endgame", issue: "1", publisher: "Marvel", year: "2025", rarity: "Skottie Young Variant", price: "$6.00" },
                    "759606096237": { title: "Amazing Spider-Man", issue: "300", publisher: "Marvel", year: "1988", rarity: "Key Issue, Todd McFarlane", price: "$350.00" }
                };
                
                if (mockDb[barcode]) {
                    setCurrentComic(mockDb[barcode]);
                } else {
                    const publishers = ["Marvel", "DC", "Image", "Dark Horse", "IDW"];
                    const pubIndex = parseInt(barcode.slice(-1) || "0") % 5;
                    setCurrentComic({
                        title: "Unknown Barcode: " + barcode.slice(-6),
                        issue: parseInt(barcode.slice(-3, -1) || "1"),
                        publisher: publishers[pubIndex],
                        year: "202" + (parseInt(barcode.slice(-2) || "0") % 5),
                        rarity: "Standard Cover",
                        price: "$" + ((parseInt(barcode.slice(-2) || "0") % 15) + 3) + ".00"
                    });
                }
            };

            const saveToSheet = async () => {
                if (!scriptUrl) {
                    setHistory([currentComic, ...history]);
                    setCurrentComic(null);
                    return;
                }

                setIsSaving(true);
                try {
                    const payload = {
                        barcode: "AI_SCAN",
                        title: currentComic.title,
                        issue: currentComic.issue,
                        publisher: currentComic.publisher,
                        year: currentComic.year,
                        rarity: currentComic.rarity,
                        price: currentComic.price
                    };

                    await fetch(scriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    setHistory([currentComic, ...history]);
                    setCurrentComic(null);
                } catch (err) {
                    console.error(err);
                    triggerError("Failed to save to Google Sheet. Check URL.");
                } finally {
                    setIsSaving(false);
                }
            };

            return (
                <div className="min-h-screen max-w-md mx-auto flex flex-col relative pb-20">
                    {/* Header */}
                    <div className="flex justify-between items-center p-4 border-b border-slate-800 bg-slate-900 sticky top-0 z-10">
                        <div className="flex items-center gap-2">
                            <Icons.Book />
                            <h1 className="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
                                Comic Scanner AI
                            </h1>
                        </div>
                        <button onClick={() => setShowSettings(!showSettings)} className="p-2 text-slate-400 hover:text-white rounded-full transition-colors">
                            <Icons.Settings />
                        </button>
                    </div>

                    {/* Settings Panel */}
                    {showSettings && (
                        <div className="p-4 bg-slate-800 border-b border-slate-700 animate-fade-in">
                            <h2 className="font-bold mb-4 text-purple-400">Configuration</h2>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">Gemini API Key (For AI Scan)</label>
                                    <input 
                                        type="password" 
                                        value={apiKey}
                                        onChange={(e) => {
                                            setApiKey(e.target.value);
                                            localStorage.setItem('geminiApiKey', e.target.value);
                                        }}
                                        className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:border-purple-500 outline-none"
                                        placeholder="AIzaSy..."
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">Google App Script URL (For Sheets)</label>
                                    <input 
                                        type="text" 
                                        value={scriptUrl}
                                        onChange={(e) => {
                                            setScriptUrl(e.target.value);
                                            localStorage.setItem('sheetScriptUrl', e.target.value);
                                        }}
                                        className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:border-purple-500 outline-none"
                                        placeholder="https://script.google.com/macros/..."
                                    />
                                </div>
                                <button 
                                    onClick={() => setShowSettings(false)}
                                    className="w-full bg-purple-600 py-2 rounded-lg text-sm font-bold text-white hover:bg-purple-700 transition-colors"
                                >
                                    Close Settings
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Error Notification */}
                    {error && (
                        <div className="m-4 p-3 bg-red-900/50 border border-red-500/50 rounded-lg text-red-200 text-sm text-center animate-pulse">
                            {error}
                        </div>
                    )}

                    {/* Navigation Tabs */}
                    {!currentComic && (
                        <div className="flex px-4 pt-2 mb-4 bg-slate-900">
                            <button onClick={() => setActiveTab('ai')} className={`flex-1 pb-3 text-sm font-medium flex flex-col items-center gap-1 ${activeTab === 'ai' ? 'tab-active' : 'text-slate-500'}`}>
                                <Icons.Camera /> AI Cover
                            </button>
                            <button onClick={() => setActiveTab('barcode')} className={`flex-1 pb-3 text-sm font-medium flex flex-col items-center gap-1 ${activeTab === 'barcode' ? 'tab-active' : 'text-slate-500'}`}>
                                <Icons.Barcode /> Barcode
                            </button>
                            <button onClick={() => setActiveTab('manual')} className={`flex-1 pb-3 text-sm font-medium flex flex-col items-center gap-1 ${activeTab === 'manual' ? 'tab-active' : 'text-slate-500'}`}>
                                <Icons.Manual /> Manual
                            </button>
                        </div>
                    )}

                    {}
                    <div className="px-4 flex-grow">
                        {!currentComic ? (
                            <>
                                {activeTab === 'ai' && <AICoverScanner apiKey={apiKey} onResult={setCurrentComic} onError={triggerError} />}
                                {activeTab === 'barcode' && <SafeBarcodeScanner onResult={handleBarcodeScan} onError={triggerError} />}
                                {activeTab === 'manual' && (
                                    <div className="mt-8">
                                        <p className="text-slate-400 mb-4 text-center">Manually enter comic details</p>
                                        <button onClick={() => setCurrentComic({title: "Manual Entry", issue: "1", publisher: "Unknown", year: "2024", rarity: "Raw", price: "$0.00"})} className="w-full bg-slate-700 py-4 rounded-xl text-white font-bold hover:bg-slate-600 transition-colors">
                                            Open Manual Form
                                        </button>
                                    </div>
                                )}
                            </>
                        ) : (
                            <div className="bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700 mt-4 animate-fade-in">
                                <div className="flex justify-between items-start mb-6">
                                    <div>
                                        <h2 className="text-2xl font-black text-white">{currentComic.title}</h2>
                                        <p className="text-purple-400 font-bold mt-1">Issue #{currentComic.issue}</p>
                                    </div>
                                    <div className="bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-full font-bold">
                                        {currentComic.price}
                                    </div>
                                </div>

                                <div className="space-y-3 text-sm">
                                    <div className="flex justify-between border-b border-slate-700 pb-2">
                                        <span className="text-slate-400">Publisher</span>
                                        <span className="font-medium text-white">{currentComic.publisher}</span>
                                    </div>
                                    <div className="flex justify-between border-b border-slate-700 pb-2">
                                        <span className="text-slate-400">Year</span>
                                        <span className="font-medium text-white">{currentComic.year}</span>
                                    </div>
                                    <div className="flex justify-between pt-2">
                                        <span className="text-slate-400 w-1/3">Notes</span>
                                        <span className="font-medium text-white text-right">{currentComic.rarity}</span>
                                    </div>
                                </div>

                                <div className="flex gap-4 mt-8">
                                    <button 
                                        onClick={() => setCurrentComic(null)} 
                                        className="w-1/3 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold transition-colors"
                                    >
                                        Discard
                                    </button>
                                    <button 
                                        onClick={saveToSheet} 
                                        disabled={isSaving}
                                        className="w-2/3 py-3 bg-emerald-600 disabled:bg-emerald-800 hover:bg-emerald-500 text-white rounded-xl font-bold flex items-center justify-center gap-2 transition-colors shadow-lg shadow-emerald-900/50"
                                    >
                                        <span key={isSaving ? 'saving' : 'save'}>
                                            {isSaving ? <Icons.Spinner /> : <Icons.Save />}
                                        </span>
                                        {isSaving ? 'Saving...' : 'Save Comic'}
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    {}
                    {!currentComic && history.length > 0 && (
                        <div className="px-4 mt-8">
                            <h3 className="text-xs font-bold text-slate-500 mb-3 uppercase tracking-wider">Session History</h3>
                            <div className="space-y-3">
                                {history.map((comic, idx) => (
                                    <div key={idx} className="bg-slate-800/50 border border-slate-700 p-3 rounded-lg flex justify-between items-center">
                                        <div>
                                            <p className="font-bold text-sm text-white">{comic.title} #{comic.issue}</p>
                                            <p className="text-xs text-slate-400">{comic.publisher}</p>
                                        </div>
                                        <p className="text-emerald-400 font-bold text-sm">{comic.price}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
