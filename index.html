<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comic Book Scanner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- HTML5 QRCode Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom scrollbar for collection list */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }

        /* Video element styling overrides for html5-qrcode */
        #reader video {
            object-fit: cover;
            border-radius: 0.75rem;
        }
        #reader {
            border: none !important;
            border-radius: 0.75rem;
            overflow: hidden;
            background: #000;
        }
        #reader__dashboard_section_csr span {
            color: #fff !important;
        }
        #reader__dashboard_section_csr button {
            background-color: #3b82f6 !important;
            color: white !important;
            border: none !important;
            padding: 0.5rem 1rem !important;
            border-radius: 0.5rem !important;
            margin-top: 0.5rem !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Mock Data Generator for Comic Books ---
        // In a real app, you would use an API like Comic Vine or Metron.
        const generateMockComic = (barcode) => {
            const publishers = ["Marvel Comics", "DC Comics", "Image Comics", "Dark Horse", "IDW Publishing"];
            const titles = ["Amazing Spider-Man", "Batman", "Spawn", "X-Men", "Superman", "Saga", "The Walking Dead", "Daredevil", "Flash", "Invincible"];
            const rarities = ["Standard", "Standard", "Standard", "Variant Cover", "Key Issue", "Retailer Incentive (1:25)"];
            
            // Seed randomness based on barcode string so the same barcode always gives the same comic
            let seed = 0;
            for (let i = 0; i < barcode.length; i++) {
                seed += barcode.charCodeAt(i);
            }
            
            const publisher = publishers[seed % publishers.length];
            const title = titles[(seed * 3) % titles.length];
            const issueNo = (seed % 150) + 1;
            const year = 2024 - (seed % 40);
            const rarity = rarities[(seed * 7) % rarities.length];
            
            let price = (Math.random() * 20 + 3).toFixed(2);
            if (rarity === "Key Issue") price = (Math.random() * 300 + 50).toFixed(2);
            if (rarity.includes("Variant")) price = (Math.random() * 50 + 10).toFixed(2);

            return {
                id: barcode,
                title: title,
                issue: `#${issueNo}`,
                publisher: publisher,
                year: year,
                rarity: rarity,
                price: parseFloat(price),
                scannedAt: new Date().toISOString()
            };
        };

        // --- Notification Component ---
        const Notification = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600';

            return (
                <div className={`fixed top-4 left-1/2 transform -translate-x-1/2 z-50 ${bgColor} text-white px-4 py-2 rounded-full shadow-lg flex items-center space-x-2 animate-bounce`}>
                    <span className="text-sm font-medium">{message}</span>
                </div>
            );
        };

        // --- STREAMING_CHUNK:Implementing Camera Scanner Component ---
        const Scanner = ({ onScan }) => {
            const [scanning, setScanning] = useState(false);
            const scannerRef = useRef(null);

            useEffect(() => {
                // Cleanup on unmount
                return () => {
                    if (scannerRef.current) {
                        scannerRef.current.clear().catch(console.error);
                    }
                };
            }, []);

            const startScanner = () => {
                setScanning(true);
                // Delay slightly to let the UI render the #reader div
                setTimeout(() => {
                    const html5QrcodeScanner = new Html5Qrcode("reader");
                    scannerRef.current = html5QrcodeScanner;
                    
                    const config = { fps: 10, qrbox: { width: 250, height: 150 }, aspectRatio: 1.0 };
                    
                    html5QrcodeScanner.start(
                        { facingMode: "environment" }, // Use back camera on mobile
                        config,
                        (decodedText, decodedResult) => {
                            // On successful scan
                            if (window.navigator.vibrate) window.navigator.vibrate(100); // Haptic feedback
                            html5QrcodeScanner.stop().then(() => {
                                setScanning(false);
                                onScan(decodedText);
                            }).catch(console.error);
                        },
                        (errorMessage) => {
                            // Ignored: continuous scanning errors (expected when no barcode is in view)
                        }
                    ).catch((err) => {
                        console.error("Error starting scanner", err);
                        alert("Camera access denied or unavailable. Please ensure permissions are granted.");
                        setScanning(false);
                    });
                }, 100);
            };

            const stopScanner = () => {
                if (scannerRef.current) {
                    scannerRef.current.stop().then(() => {
                        setScanning(false);
                    }).catch(console.error);
                }
            };

            return (
                <div className="w-full flex flex-col items-center">
                    {scanning && (
                        <div className="w-full max-w-sm mx-auto mb-4 relative">
                            <div id="reader" className="w-full rounded-xl shadow-lg border-2 border-blue-500 overflow-hidden min-h-[300px]"></div>
                            <div className="absolute inset-0 border-4 border-dashed border-blue-400/50 rounded-xl pointer-events-none animate-pulse"></div>
                            <p className="text-center text-sm text-slate-400 mt-2">Align UPC barcode within the frame</p>
                        </div>
                    )}
                    
                    {!scanning ? (
                        <button 
                            onClick={startScanner}
                            className="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg flex items-center justify-center space-x-2 transition-all active:scale-95"
                        >
                            <i data-lucide="camera" className="w-6 h-6"></i>
                            <span>Tap to Scan Comic</span>
                        </button>
                    ) : (
                        <button 
                            onClick={stopScanner}
                            className="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-lg flex items-center justify-center space-x-2 transition-all active:scale-95"
                        >
                            <i data-lucide="x-circle" className="w-5 h-5"></i>
                            <span>Cancel Scan</span>
                        </button>
                    )}
                </div>
            );
        };

        // --- STREAMING_CHUNK:Main App Layout and State Management ---
        const App = () => {
            const [collection, setCollection] = useState([]);
            const [currentComic, setCurrentComic] = useState(null);
            const [sheetUrl, setSheetUrl] = useState(localStorage.getItem('googleSheetUrl') || '');
            const [showSettings, setShowSettings] = useState(false);
            const [notification, setNotification] = useState(null);
            const [isSaving, setIsSaving] = useState(false);

            // Re-initialize Lucide icons when renders change
            useEffect(() => {
                lucide.createIcons();
            });

            // Handle successful barcode scan
            const handleScan = (barcode) => {
                setNotification({ message: "Barcode detected! Looking up...", type: "info" });
                
                // Simulate network delay for API lookup
                setTimeout(() => {
                    const comicData = generateMockComic(barcode);
                    setCurrentComic(comicData);
                    setNotification(null);
                }, 800);
            };

            // --- STREAMING_CHUNK:Google Sheets Export Logic ---
            const saveToSheet = async () => {
                if (!currentComic) return;
                
                // Add to local collection state immediately
                setCollection(prev => [currentComic, ...prev]);

                if (!sheetUrl) {
                    setNotification({ message: "Saved locally. Add Webhook URL to save to Sheets.", type: "info" });
                    setCurrentComic(null);
                    return;
                }

                setIsSaving(true);
                
                try {
                    // Send data to Google Apps Script Webhook
                    const response = await fetch(sheetUrl, {
                        method: 'POST',
                        mode: 'no-cors', // Required for simple Google Apps Script webhooks without complex CORS setup
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            barcode: currentComic.id,
                            title: currentComic.title,
                            issue: currentComic.issue,
                            publisher: currentComic.publisher,
                            year: currentComic.year,
                            rarity: currentComic.rarity,
                            price: currentComic.price
                        })
                    });

                    // Because of 'no-cors', response is opaque. We assume success if no exception is thrown.
                    setNotification({ message: "Saved to Google Sheet!", type: "success" });
                } catch (error) {
                    console.error("Error saving to sheet:", error);
                    setNotification({ message: "Error saving to Sheet. Check URL.", type: "error" });
                } finally {
                    setIsSaving(false);
                    setCurrentComic(null); // Clear current to ready for next scan
                }
            };

            const saveSettings = () => {
                localStorage.setItem('googleSheetUrl', sheetUrl);
                setShowSettings(false);
                setNotification({ message: "Settings saved", type: "success" });
            };

            const clearCollection = () => {
                if(confirm("Are you sure you want to clear your local session history?")) {
                    setCollection([]);
                }
            };

            return (
                <div className="min-h-screen flex flex-col max-w-md mx-auto bg-slate-900 border-x border-slate-800 shadow-2xl relative">
                    
                    {notification && (
                        <Notification 
                            message={notification.message} 
                            type={notification.type} 
                            onClose={() => setNotification(null)} 
                        />
                    )}

                    {/* Header */}
                    <header className="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center sticky top-0 z-10">
                        <div className="flex items-center space-x-2">
                            <i data-lucide="book-open" className="text-blue-400 w-6 h-6"></i>
                            <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-400">
                                Comic Scanner
                            </h1>
                        </div>
                        <button 
                            onClick={() => setShowSettings(!showSettings)}
                            className="p-2 text-slate-400 hover:text-white transition-colors"
                        >
                            <i data-lucide="settings" className="w-6 h-6"></i>
                        </button>
                    </header>

                    {}
                    {showSettings && (
                        <div className="p-4 bg-slate-800 border-b border-slate-700 animate-fade-in">
                            <h2 className="text-sm font-semibold text-slate-300 mb-2 uppercase tracking-wide">Google Sheets Setup</h2>
                            <p className="text-xs text-slate-400 mb-4">
                                Paste your Google Apps Script Web App URL below to send scanned comics directly to a spreadsheet.
                            </p>
                            <input 
                                type="url" 
                                value={sheetUrl}
                                onChange={(e) => setSheetUrl(e.target.value)}
                                placeholder="https://script.google.com/macros/s/..."
                                className="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:ring-2 focus:ring-blue-500 outline-none mb-3"
                            />
                            <div className="flex space-x-2">
                                <button 
                                    onClick={saveSettings}
                                    className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-medium"
                                >
                                    Save Config
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Main Content Area */}
                    <main className="flex-1 p-4 flex flex-col space-y-6 overflow-y-auto">
                        
                        {/* Scanner Section */}
                        <section>
                            <Scanner onScan={handleScan} />
                        </section>

                        {}
                        {currentComic && (
                            <section className="bg-slate-800 rounded-xl p-5 border border-blue-500/30 shadow-lg shadow-blue-900/20 animate-fade-in relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-24 h-24 bg-blue-500/10 rounded-bl-full -z-0"></div>
                                
                                <div className="flex justify-between items-start relative z-10 mb-4">
                                    <div>
                                        <p className="text-xs font-semibold text-slate-400 uppercase tracking-widest">{currentComic.publisher}</p>
                                        <h2 className="text-2xl font-bold text-white leading-tight mt-1">{currentComic.title}</h2>
                                        <p className="text-lg font-medium text-blue-400">{currentComic.issue} <span className="text-slate-500 text-sm">({currentComic.year})</span></p>
                                    </div>
                                    <div className="bg-slate-900 px-3 py-1 rounded-lg border border-slate-700 text-right">
                                        <p className="text-xs text-slate-400">Est. Value</p>
                                        <p className="text-xl font-bold text-emerald-400">${currentComic.price.toFixed(2)}</p>
                                    </div>
                                </div>

                                <div className="flex items-center space-x-2 mb-6">
                                    <span className={`px-2 py-1 text-xs font-bold rounded-md ${
                                        currentComic.rarity === 'Key Issue' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/50' : 
                                        currentComic.rarity.includes('Variant') ? 'bg-purple-500/20 text-purple-400 border border-purple-500/50' : 
                                        'bg-slate-700 text-slate-300'
                                    }`}>
                                        {currentComic.rarity}
                                    </span>
                                    <span className="text-xs text-slate-500 font-mono">UPC: {currentComic.id}</span>
                                </div>

                                <div className="flex space-x-3 relative z-10">
                                    <button 
                                        onClick={() => setCurrentComic(null)}
                                        className="flex-1 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-medium transition-colors"
                                    >
                                        Discard
                                    </button>
                                    <button 
                                        onClick={saveToSheet}
                                        disabled={isSaving}
                                        className="flex-[2] py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold flex justify-center items-center space-x-2 transition-colors disabled:opacity-50"
                                    >
                                        <i data-lucide={isSaving ? "loader-2" : "database"} className={`w-5 h-5 ${isSaving ? 'animate-spin' : ''}`}></i>
                                        <span>{isSaving ? 'Saving...' : 'Save to Collection'}</span>
                                    </button>
                                </div>
                            </section>
                        )}

                        {}
                        <section className="flex-1">
                            <div className="flex justify-between items-center mb-3">
                                <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wide">Session History</h3>
                                {collection.length > 0 && (
                                    <button onClick={clearCollection} className="text-xs text-red-400 hover:text-red-300">Clear</button>
                                )}
                            </div>
                            
                            {collection.length === 0 ? (
                                <div className="text-center py-10 text-slate-600">
                                    <i data-lucide="inbox" className="w-12 h-12 mx-auto mb-2 opacity-20"></i>
                                    <p className="text-sm">No comics scanned in this session.</p>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {collection.map((comic, idx) => (
                                        <div key={idx} className="bg-slate-800 p-3 rounded-lg border border-slate-700 flex justify-between items-center">
                                            <div>
                                                <p className="text-white font-medium text-sm leading-none mb-1">
                                                    {comic.title} <span className="text-blue-400">{comic.issue}</span>
                                                </p>
                                                <div className="flex items-center space-x-2 text-xs">
                                                    <span className="text-slate-400">{comic.publisher}</span>
                                                    <span className="text-slate-600">•</span>
                                                    <span className={comic.rarity === 'Key Issue' ? 'text-amber-400' : 'text-slate-500'}>
                                                        {comic.rarity}
                                                    </span>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-emerald-400 font-bold text-sm">${comic.price.toFixed(2)}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </section>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
